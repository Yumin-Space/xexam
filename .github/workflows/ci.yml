name: Build, test and publish

# Xexam pipeline: check -> test (frontend, backend, AI service, Nginx / full-stack checks of the three images) -> build amd64 + arm64 -> publish the three images -> create the Release.
#   - Push to main: everything runs, the xexam-frontend, xexam-backend and xexam-ai-service images are published, and the GitHub Release is created (or updated).
#   - Push to dev, pull requests and other branches: check and test only, **never publish** (publish and release require refs/heads/main).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No permissions by default; the ones a job needs are enabled in that job below
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # on main, runs queue instead of being cancelled, so a publish is not interrupted halfway

env:
  # Do not upload build records as artifacts (two extra .dockerbuild files per run, useless)
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CARGO_TERM_COLOR: never

jobs:
  # (1) Check: VERSION holds CODE_VERSION (the code on this branch) and RELEASE_VERSION (the last published release, written
  #     by the release job below, never by hand). The newest changelog entry of EVERY README (English README.md at the root,
  #     Japanese and Chinese in README/) and the backend / AI service / frontend manifests equal CODE_VERSION; the release badge
  #     at the top of every README equals RELEASE_VERSION; docker/docker-compose.yml pulls the three images; the README, docker
  #     and docs layout is as documented and every relative link resolves. Takes seconds; if it fails nothing else runs. Its
  #     output "version" is CODE_VERSION.
  check:
    name: check version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Check version and changelog
        run: |
          set -eu
          # VERSION has KEY=VALUE lines and # comments; each key must appear exactly once, then read the two values
          for key in CODE_VERSION RELEASE_VERSION; do
            n=$(grep -c "^$key=" VERSION || true)
            [ "$n" = 1 ] || { echo "VERSION must have exactly one $key= line (found $n); it needs one CODE_VERSION= and one RELEASE_VERSION= line"; exit 1; }
          done
          v=$(sed -n -E 's/^CODE_VERSION=[[:space:]]*([^[:space:]]*)[[:space:]]*$/\1/p' VERSION)
          rv=$(sed -n -E 's/^RELEASE_VERSION=[[:space:]]*([^[:space:]]*)[[:space:]]*$/\1/p' VERSION)
          for pair in "CODE_VERSION:$v" "RELEASE_VERSION:$rv"; do
            echo "${pair#*:}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "VERSION: ${pair%%:*} is missing or malformed: '${pair#*:}' (expected something like 0.6 or 0.6.5)"; exit 1; }
          done
          # A release can only be a version the code already reached
          [ "$(printf '%s\n%s\n' "$rv" "$v" | sort -V | tail -n1)" = "$v" ] || { echo "VERSION: RELEASE_VERSION $rv is newer than CODE_VERSION $v"; exit 1; }
          # The English README stays at the root (GitHub shows it on the repository page); the Japanese and Chinese ones live in README/
          readmes="README.md README/README.ja.md README/README.zh-CN.md"
          for f in $readmes; do
            [ -f "$f" ] || { echo "$f is missing: the project keeps three READMEs (README.md in English at the root, README/README.ja.md, README/README.zh-CN.md)"; exit 1; }
            top=$(grep -m1 -E '^### v[0-9]' "$f" | sed -E 's/^### v([0-9][0-9.]*).*$/\1/')
            [ "$top" = "$v" ] || { echo "The newest changelog entry in $f is v${top:-(none found)}, but CODE_VERSION is $v. Write the changelog entry in all three READMEs and keep them equal to CODE_VERSION."; exit 1; }
            # The release badge at the top shows the last published release; the release job updates it (scripts/set-release-version.py)
            grep -q "img.shields.io/badge/release-v$rv-green" "$f" || { echo "The release badge at the top of $f does not say v$rv (RELEASE_VERSION). Do not edit it by hand: the release job sets it after a release."; exit 1; }
          done
          for m in backend/Cargo.toml ai-service/Cargo.toml frontend/package.json; do
            [ -f "$m" ] || { echo "$m is missing"; exit 1; }
            mv=$(grep -m1 -E '^[[:space:]]*"?version"?[[:space:]]*[=:]' "$m" | sed -E 's/.*"([0-9][0-9.]*)".*/\1/')
            case "$mv" in "$v"|"$v".0) ;; *) echo "$m has version $mv but CODE_VERSION is $v"; exit 1;; esac
          done
          extra=$(find . -maxdepth 1 -name 'README*' ! -name README.md ! -name README; find README -mindepth 1 ! -name README.ja.md ! -name README.zh-CN.md)
          [ -z "$extra" ] || { echo "Only README.md stays at the root and README/ holds only README.ja.md and README.zh-CN.md; found: $extra"; exit 1; }
          # The compose files and the configuration template live in docker/ (the Dockerfiles stay in backend/ and nginx/)
          for c in docker-compose.yml docker-compose.build.yml .env.example; do
            [ -f "docker/$c" ] || { echo "docker/$c is missing"; exit 1; }
            [ ! -e "$c" ] || { echo "$c belongs in docker/, not at the repository root"; exit 1; }
          done
          # docker-compose.yml pulls the three images from Docker Hub (the publish job checks that the namespace is the one it pushes to)
          for img in xexam-backend xexam-ai-service xexam-frontend; do
            grep -Eq "^[[:space:]]*image: docker\.io/[a-z0-9._-]+/$img:latest[[:space:]]*$" docker/docker-compose.yml || {
              echo "docker/docker-compose.yml must pull the image with image: docker.io/<namespace>/$img:latest"; exit 1; }
          done
          # The eight current docs exist in three languages, one folder per language (docs/en, docs/ja, docs/zh-CN)
          for d in api architecture database deployment development migration security usage; do
            for l in en ja zh-CN; do
              [ -f "docs/$l/$d.md" ] || { echo "docs/$l/$d.md is missing: every current doc is kept in English, Japanese and Chinese"; exit 1; }
            done
          done
          # Nothing but the language folders directly under docs/ (the languages are not mixed)
          extra=$(find docs -mindepth 1 -maxdepth 1 ! -name en ! -name ja ! -name zh-CN)
          [ -z "$extra" ] || { echo "docs/ must only contain the en, ja and zh-CN folders; found: $extra"; exit 1; }
          # Every relative link in the READMEs and in all docs points at a file that exists; in the READMEs this includes the src / href
          # of HTML tags (images). Anchors, URLs and regex-like text inside code are not checked. GitHub-site links (../../releases,
          # ../../blob/..., and so on) are not files: they must climb exactly to the repository page, which is two levels above a file
          # at the root and one more level per folder (../../../releases inside README/).
          bad=0
          for f in $readmes $(find docs -name "*.md"); do
            dir=$(dirname "$f")
            site=$(printf '../%.0s' $(seq 1 $(( $(printf '%s' "$dir" | awk -F/ '{print ($0 == "." ? 0 : NF)}') + 2 ))))
            links=$(grep -o '\]([^)#[:space:]]*' "$f" | sed 's/^](//')
            case "$f" in README*) links="$links $(grep -oE '(src|href)="[^"#[:space:]]*' "$f" | sed -E 's/^(src|href)="//')";; esac
            for l in $(printf '%s\n' $links | grep -Ev '^(https?:|mailto:|$)|[[^]' | sort -u); do
              if printf '%s' "$l" | grep -Eq '^(\.\./)+(releases|issues|actions|pulls|packages|blob|tree)(/|$)'; then
                rest=${l#"$site"}
                case "$rest" in "$l"|../*) echo "$f links to $l: a GitHub-site link from $dir must start with exactly $site"; bad=1;; esac
              else
                [ -e "$dir/$l" ] || { echo "$f links to $l, which does not exist"; bad=1; }
              fi
            done
          done
          [ "$bad" = 0 ] || exit 1
          echo "version v$v, changelog entries present in all three READMEs, README / docker / docs layout as documented, links resolve, manifests match, compose pulls the three images"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # (2) Frontend: type check, unit tests, build
  frontend:
    name: frontend (tsc, unit tests, build)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # (2) Backend: format, clippy, all tests (against the committed legacy snapshots: 172 golden responses, 49 parser fixtures, 85 id vectors), and the progress.json migration check
  backend:
    name: backend (fmt, clippy, test)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: progress.json migration (documented restart flow, synthetic data)
        run: |
          cargo build
          python3 -I ../tests/integration/migrate_check.py target/debug/xexam-backend

  # (2) AI service: format, clippy, all tests, and the TLS guard: its dependency tree has no OpenSSL, aws-lc or native-tls
  #     (outbound TLS is rustls + ring with the Mozilla roots compiled in, so the runtime image needs no CA bundle)
  ai-service:
    name: ai-service (fmt, clippy, test, TLS guard)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ai-service/target
          key: cargo-ai-service-${{ runner.os }}-${{ hashFiles('ai-service/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: TLS guard (no aws-lc, openssl-sys or native-tls)
        run: |
          set -eu
          tree=$(cargo tree -e normal --target all)
          if printf '%s\n' "$tree" | grep -Eq '(aws-lc|openssl-sys|native-tls)'; then
            printf '%s\n' "$tree" | grep -E '(aws-lc|openssl-sys|native-tls)'
            echo "The AI service must not depend on aws-lc, openssl-sys or native-tls (TLS is rustls + ring)"
            exit 1
          fi
          echo "TLS guard: no aws-lc, openssl-sys or native-tls in the dependency tree"

  # (2) Build the three images on amd64, run the Nginx behaviour checks (two fake upstreams: the backend and the AI service) and the
  #     full-stack end-to-end check (compose up, import, submit, AI with a made-up provider, data survives removing the containers, docker stop)
  stack:
    name: stack (images, nginx checks, end to end)
    needs: [frontend, backend, ai-service]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build the frontend image and run the proxy checks
        run: |
          docker build -f nginx/Dockerfile -t xexam-frontend:test .
          python3 -I tests/integration/nginx_check.py xexam-frontend:test 18080
      - name: End to end (compose up, import, attempts, AI, persistence, docker stop)
        run: python3 -I tests/integration/stack_check.py 18090

  # (2) arm64: the three images are really built and really started under QEMU (the backend and the AI service are cross-compiled with zig on the build machine, not compiled as Rust inside QEMU).
  #    Private repositories cannot use GitHub's native arm64 runners, so running is emulated with QEMU. Build only, no push; discarded afterwards.
  arm64:
    name: arm64 (images build and start under QEMU)
    needs: [check, frontend, backend, ai-service]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build xexam-backend (arm64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: xexam-backend:arm64
          cache-from: type=gha,scope=backend-arm64-check
          cache-to: type=gha,scope=backend-arm64-check,mode=max
      - name: Build xexam-frontend (arm64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: xexam-frontend:arm64
          cache-from: type=gha,scope=frontend-arm64-check
          cache-to: type=gha,scope=frontend-arm64-check,mode=max
      - name: Build xexam-ai-service (arm64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ai-service/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: xexam-ai-service:arm64
          cache-from: type=gha,scope=ai-service-arm64-check
          cache-to: type=gha,scope=ai-service-arm64-check,mode=max
      - name: Start the three images and check them
        env:
          VERSION: ${{ needs.check.outputs.version }}     # CODE_VERSION, which /api/info reports
        run: |
          set -eu
          docker volume create arm64data >/dev/null
          docker run -d --name arm64-backend --platform linux/arm64 -v arm64data:/data xexam-backend:arm64 >/dev/null
          for i in $(seq 1 60); do
            docker exec arm64-backend /usr/local/bin/xexam-backend healthcheck >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { docker logs arm64-backend; echo "backend did not become healthy"; exit 1; }
            sleep 2
          done
          info=$(docker exec arm64-backend wget -qO- --header 'Host: localhost' http://127.0.0.1:8765/api/info)
          echo "backend /api/info: $info"
          echo "$info" | grep -q '"arch": "aarch64"' || { echo "backend is not running as aarch64"; exit 1; }
          echo "$info" | grep -q '"version": "'"$VERSION"'"' || { echo "version mismatch: /api/info should report CODE_VERSION $VERSION"; exit 1; }
          docker run -d --name arm64-frontend --platform linux/arm64 xexam-frontend:arm64 >/dev/null
          for i in $(seq 1 30); do
            docker exec arm64-frontend wget -qO- http://127.0.0.1:8080/healthz 2>/dev/null | grep -q '^ok' && break
            [ "$i" = 30 ] && { docker logs arm64-frontend; echo "frontend did not answer /healthz"; exit 1; }
            sleep 1
          done
          [ "$(docker exec arm64-frontend uname -m)" = "aarch64" ] || { echo "frontend is not aarch64"; exit 1; }
          docker exec arm64-frontend wget -qO- http://127.0.0.1:8080/index.html | grep -qi '<div id="app"\|<title>' || { echo "frontend does not serve index.html"; exit 1; }
          # The AI service alone (no backend): its own healthcheck and /healthz do not depend on the backend or a provider.
          # The token only lets it start without the link volume; the value is a throw-away one for this check.
          docker volume create arm64aidata >/dev/null
          docker run -d --name xexam-ai-service-arm64 --platform linux/arm64 -e XEXAM_INTERNAL_TOKEN=arm64-check-0123456789abcdefghijklmnopqrstuvwxyz \
            -v arm64aidata:/data xexam-ai-service:arm64 >/dev/null
          for i in $(seq 1 60); do
            docker exec xexam-ai-service-arm64 xexam-ai-service healthcheck >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { docker logs xexam-ai-service-arm64; echo "ai-service did not become healthy"; exit 1; }
            sleep 2
          done
          health=$(docker exec xexam-ai-service-arm64 wget -qO- http://127.0.0.1:8766/healthz)
          echo "ai-service /healthz: $health"
          # The AI service answers compact JSON: parse it, never grep it
          printf '%s' "$health" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["arch"]=="aarch64" and d["version"]==sys.argv[1], d' "$VERSION" \
            || { echo "ai-service is not running as aarch64 with version $VERSION"; exit 1; }
          echo "arm64: the three images build and start"
      - name: Clean up
        if: always()
        run: |
          docker rm -f arm64-backend arm64-frontend xexam-ai-service-arm64 >/dev/null 2>&1 || true
          docker volume rm arm64data arm64aidata >/dev/null 2>&1 || true

  # (3) Only when every check has passed are the three images (amd64 + arm64) published, to Docker Hub (public; what
  #     docker/docker-compose.yml pulls) and to ghcr.io (same tags, a mirror). Published from main only; pull requests and other
  #     branches never publish. Docker Hub needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access
  #     token with Read & Write). The namespace is DOCKERHUB_USERNAME, or the repository variable DOCKERHUB_NAMESPACE if set.
  publish:
    name: publish ${{ matrix.image }} (amd64 + arm64)
    needs: [check, frontend, backend, ai-service, stack, arm64]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write          # needed to push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xexam-backend
            dockerfile: backend/Dockerfile
          - image: xexam-frontend
            dockerfile: nginx/Dockerfile
          - image: xexam-ai-service
            dockerfile: ai-service/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # Image names must be all lowercase, but the GitHub user name may contain capitals (Yumin-Space), so convert it first.
      # Without the Docker Hub secrets the job stops here, before anything is pushed: docker/docker-compose.yml pulls from Docker Hub,
      # so publishing only to ghcr.io would leave a release that the default setup cannot pull.
      - name: Image names
        env:
          VERSION: ${{ needs.check.outputs.version }}
          NAME: ${{ matrix.image }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -eu
          if [ -z "$HUB_USER" ] || [ -z "$HUB_TOKEN" ]; then
            echo "::error::Docker Hub secrets missing: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN under Settings > Secrets and variables > Actions"
            exit 1
          fi
          ns="${HUB_NAMESPACE:-$HUB_USER}"
          # docker/docker-compose.yml and the READMEs name the Docker Hub images; they must match the namespace pushed to
          grep -q "image: docker.io/${ns,,}/$NAME:latest" docker/docker-compose.yml || {
            echo "::error::docker/docker-compose.yml does not pull docker.io/${ns,,}/$NAME:latest (wrong DOCKERHUB_USERNAME / DOCKERHUB_NAMESPACE, or the file names another namespace)"
            exit 1
          }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$NAME" >> "$GITHUB_ENV"
          echo "HUB_IMAGE=docker.io/${ns,,}/$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest = the most recent build; vX.Y = this version; sha-xxxx = this commit (never overwritten)
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.HUB_IMAGE }}
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ env.VERSION }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=v${{ env.VERSION }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          provenance: false        # no extra unknown/unknown entry, so tools such as Synology, Raspberry Pi and Portainer do not break
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-publish
          cache-to: type=gha,scope=${{ matrix.image }}-publish,mode=max

      # After publishing, look back once at both registries: read the manifest by "the digest just pushed"; it must contain both amd64 and arm64
      - name: Verify published manifest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          [ -n "$DIGEST" ] || { echo "Could not get the digest of the pushed image"; exit 1; }
          for img in "$HUB_IMAGE" "$IMAGE"; do
            out=$(docker buildx imagetools inspect "$img@$DIGEST")
            echo "$out"
            echo "$out" | grep -Eq 'Platform: +linux/amd64' || { echo "$img is missing amd64"; exit 1; }
            echo "$out" | grep -Eq 'Platform: +linux/arm64' || { echo "$img is missing arm64"; exit 1; }
            # The first "Digest:" line of the default output is the digest of this tag (the top-level manifest)
            for t in latest "v$VERSION"; do
              got=$(docker buildx imagetools inspect "$img:$t" | awk '/^Digest:/{print $2; exit}')
              [ "$got" = "$DIGEST" ] || { echo "Tag $t of $img does not point to the image just pushed ($got vs $DIGEST)"; exit 1; }
            done
            echo "Published: $img:latest and $img:v$VERSION, both containing amd64 and arm64 (digest $DIGEST)"
          done

  # (4) After the three images are published and verified, create (or update) the Release of this version on GitHub's Releases page.
  #    The notes come from the changelog of the English README (scripts/release-notes.py), so the Release page and the README always agree.
  #    If the images were not published this job is never reached, so the Release page never shows a version whose images cannot be pulled.
  release:
    name: GitHub release
    needs: [check, publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # needed to create the Release and the git tag
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # the last step needs the history of main and dev to commit and fast-forward

      - name: Create or update the release
        run: |
          set -eu
          ns="${HUB_NAMESPACE:-$HUB_USER}"
          # Docker Hub first (what docker/docker-compose.yml pulls), ghcr.io as the mirror
          python3 scripts/release-notes.py "$VERSION" "docker.io/${ns,,},ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" README.md > notes.md
          tag="v$VERSION"
          title="Xexam v$VERSION"
          # The newest release recorded on main (RELEASE_VERSION). A re-run of an older run must not mark its Release as the
          # latest one again
          git fetch --quiet origin main
          recorded=$(git show origin/main:VERSION | sed -n -E 's/^RELEASE_VERSION=[[:space:]]*([^[:space:]]*)[[:space:]]*$/\1/p')
          latest=true
          if [ -n "$recorded" ] && [ "$recorded" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$recorded" "$VERSION" | sort -V | tail -n1)" = "$recorded" ]; then
            latest=false
            echo "::notice::v$VERSION is older than the newest release v$recorded: its Release is not marked as the latest"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the same version (e.g. only the notes changed): update the notes, leave the tag alone
            gh release edit "$tag" --title "$title" --notes-file notes.md --latest="$latest"
            echo "Updated Release: $tag"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest="$latest"
            echo "Created Release: $tag (for commit $GITHUB_SHA)"
          fi
          gh release view "$tag" --json url,tagName,targetCommitish --jq '"\(.tagName) -> \(.url)"'

      # Only now, with the images published and the Release created, does RELEASE_VERSION move to this version. The step
      # writes VERSION and the release badge of the three READMEs (scripts/set-release-version.py) and commits that on main
      # through the GitHub API (GraphQL createCommitOnBranch) rather than with git push: GitHub signs the commits it creates
      # for the GITHUB_TOKEN, so the commit shows as Verified. Commits made with the GITHUB_TOKEN start no new workflow run,
      # and the message says [skip ci] as well. expectedHeadOid makes the API refuse when main moved since the fetch, as a
      # non-fast-forward push would. Then, when dev has no commits of its own yet, it fast-forwards dev to the same commit so
      # the two branches stay in line. When dev has moved on, it leaves dev alone and asks for a merge of main into dev before
      # the next merge to main. A run older than the release already recorded on main changes nothing (set-release-version.py
      # never moves RELEASE_VERSION back).
      - name: Record the released version (RELEASE_VERSION and the README badge)
        run: |
          set -eu
          git fetch --quiet origin main dev
          # Work on the newest main (another merge may have landed while this run was publishing)
          git checkout --quiet -B main origin/main
          python3 scripts/set-release-version.py "$VERSION"
          if git diff --quiet; then
            echo "RELEASE_VERSION and the badges already say v$VERSION; nothing to commit"
          else
            base=$(git rev-parse HEAD)
            # The request: every changed file with its full new content (base64), on top of the main just fetched
            python3 - "$GITHUB_REPOSITORY" main "$base" "Record release v$VERSION: RELEASE_VERSION and the README badge [skip ci]" > commit.json <<'PY'
          import base64, json, subprocess, sys
          repo, branch, base, headline = sys.argv[1:5]
          names = subprocess.run(['git', 'diff', '--name-only', '-z'], check=True, capture_output=True).stdout.decode().split('\0')
          adds = [{'path': n, 'contents': base64.b64encode(open(n, 'rb').read()).decode()} for n in names if n]
          q = 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }'
          inp = {'branch': {'repositoryNameWithOwner': repo, 'branchName': branch}, 'expectedHeadOid': base,
                 'message': {'headline': headline}, 'fileChanges': {'additions': adds}}
          json.dump({'query': q, 'variables': {'input': inp}}, sys.stdout)
          PY
            oid=$(gh api graphql --input commit.json --jq '.data.createCommitOnBranch.commit.oid')
            rm -f commit.json
            case "$oid" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
              *) echo "The GitHub API did not create the release commit (answer: '$oid')"; exit 1 ;;
            esac
            git fetch --quiet origin main
            # The commit GitHub made must hold exactly the files written above, and main must point to it
            git diff --quiet "$oid" || { echo "The API commit $oid differs from the files set-release-version.py wrote"; exit 1; }
            [ "$(git rev-parse origin/main)" = "$oid" ] || { echo "main does not point to the API commit $oid"; exit 1; }
            git reset --quiet --hard "$oid"
            verified=$(gh api "repos/$GITHUB_REPOSITORY/commits/$oid" --jq '.commit.verification.verified')
            echo "main: RELEASE_VERSION=$VERSION committed as ${oid:0:7} through the GitHub API (signature verified: $verified)"
          fi
          if git merge-base --is-ancestor origin/dev HEAD; then
            # Keeping dev in line is optional: when dev moved in the seconds since the fetch the push is refused, yet the
            # release itself is complete, so that is a notice and not a failure
            if git push --quiet origin HEAD:dev; then
              echo "dev fast-forwarded to $(git rev-parse --short HEAD)"
            else
              echo "::notice::dev moved during the release: merge main into dev (git pull origin main on dev) before the next merge to main"
            fi
          else
            echo "::notice::dev has commits that main does not have: merge main into dev (git pull origin main on dev) before the next merge to main"
          fi
