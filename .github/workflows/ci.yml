name: Build, test and publish

# Xexam pipeline: check -> test (frontend, backend, Nginx / full-stack checks of the two images) -> build amd64 + arm64 -> publish the two images -> create the Release.
#   - Push to main: everything runs, the xexam-frontend and xexam-backend images are published, and the GitHub Release is created (or updated).
#   - Push to dev, pull requests and other branches: check and test only, **never publish** (publish and release require refs/heads/main).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No permissions by default; the ones a job needs are enabled in that job below
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # on main, runs queue instead of being cancelled, so a publish is not interrupted halfway

env:
  # Do not upload build records as artifacts (two extra .dockerbuild files per run, useless)
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CARGO_TERM_COLOR: never

jobs:
  # (1) Check: VERSION is well formed, the newest changelog entry of EVERY README (English README.md at the root, Japanese and
  #     Chinese in README/) equals VERSION, the backend / frontend manifests carry the same version, the README, docker and docs
  #     layout is as documented and every relative link resolves. Takes seconds; if it fails nothing else runs.
  check:
    name: check version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Check version and changelog
        run: |
          set -eu
          v=$(tr -d '[:space:]' < VERSION)
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "VERSION is malformed: $v (expected something like 0.1 or 0.1.2)"; exit 1; }
          # The English README stays at the root (GitHub shows it on the repository page); the Japanese and Chinese ones live in README/
          readmes="README.md README/README.ja.md README/README.zh-CN.md"
          for f in $readmes; do
            [ -f "$f" ] || { echo "$f is missing: the project keeps three READMEs (README.md in English at the root, README/README.ja.md, README/README.zh-CN.md)"; exit 1; }
            top=$(grep -m1 -E '^### v[0-9]' "$f" | sed -E 's/^### v([0-9][0-9.]*).*$/\1/')
            [ "$top" = "$v" ] || { echo "The newest changelog entry in $f is v${top:-(none found)}, but VERSION is $v. Write the changelog entry in all three READMEs and keep them equal to VERSION."; exit 1; }
            # The release badge at the top is static text; it must name this version too (its width is set next to it)
            grep -q "img.shields.io/badge/release-v$v-green" "$f" || { echo "The release badge at the top of $f does not say v$v: update it (and its width) together with VERSION."; exit 1; }
          done
          for m in backend/Cargo.toml frontend/package.json; do
            mv=$(grep -m1 -E '^[[:space:]]*"?version"?[[:space:]]*[=:]' "$m" | sed -E 's/.*"([0-9][0-9.]*)".*/\1/')
            case "$mv" in "$v"|"$v".0) ;; *) echo "$m has version $mv but VERSION is $v"; exit 1;; esac
          done
          extra=$(find . -maxdepth 1 -name 'README*' ! -name README.md ! -name README; find README -mindepth 1 ! -name README.ja.md ! -name README.zh-CN.md)
          [ -z "$extra" ] || { echo "Only README.md stays at the root and README/ holds only README.ja.md and README.zh-CN.md; found: $extra"; exit 1; }
          # The compose files and the configuration template live in docker/ (the Dockerfiles stay in backend/ and nginx/)
          for c in docker-compose.yml docker-compose.build.yml .env.example; do
            [ -f "docker/$c" ] || { echo "docker/$c is missing"; exit 1; }
            [ ! -e "$c" ] || { echo "$c belongs in docker/, not at the repository root"; exit 1; }
          done
          # The seven current docs exist in three languages, one folder per language (docs/en, docs/ja, docs/zh-CN)
          for d in api architecture database deployment development migration security; do
            for l in en ja zh-CN; do
              [ -f "docs/$l/$d.md" ] || { echo "docs/$l/$d.md is missing: every current doc is kept in English, Japanese and Chinese"; exit 1; }
            done
          done
          # Nothing but the language folders directly under docs/ (the languages are not mixed)
          extra=$(find docs -mindepth 1 -maxdepth 1 ! -name en ! -name ja ! -name zh-CN)
          [ -z "$extra" ] || { echo "docs/ must only contain the en, ja and zh-CN folders; found: $extra"; exit 1; }
          # Every relative link in the READMEs and in all docs points at a file that exists; in the READMEs this includes the src / href
          # of HTML tags (images). Anchors, URLs and regex-like text inside code are not checked. GitHub-site links (../../releases,
          # ../../blob/..., and so on) are not files: they must climb exactly to the repository page, which is two levels above a file
          # at the root and one more level per folder (../../../releases inside README/).
          bad=0
          for f in $readmes $(find docs -name "*.md"); do
            dir=$(dirname "$f")
            site=$(printf '../%.0s' $(seq 1 $(( $(printf '%s' "$dir" | awk -F/ '{print ($0 == "." ? 0 : NF)}') + 2 ))))
            links=$(grep -o '\]([^)#[:space:]]*' "$f" | sed 's/^](//')
            case "$f" in README*) links="$links $(grep -oE '(src|href)="[^"#[:space:]]*' "$f" | sed -E 's/^(src|href)="//')";; esac
            for l in $(printf '%s\n' $links | grep -Ev '^(https?:|mailto:|$)|[[^]' | sort -u); do
              if printf '%s' "$l" | grep -Eq '^(\.\./)+(releases|issues|actions|pulls|packages|blob|tree)(/|$)'; then
                rest=${l#"$site"}
                case "$rest" in "$l"|../*) echo "$f links to $l: a GitHub-site link from $dir must start with exactly $site"; bad=1;; esac
              else
                [ -e "$dir/$l" ] || { echo "$f links to $l, which does not exist"; bad=1; }
              fi
            done
          done
          [ "$bad" = 0 ] || exit 1
          echo "version v$v, changelog entries present in all three READMEs, README / docker / docs layout as documented, links resolve, manifests match"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # (2) Frontend: type check, unit tests, build
  frontend:
    name: frontend (tsc, unit tests, build)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # (2) Backend: format, clippy, all tests (against the committed legacy snapshots: 172 golden responses, 49 parser fixtures, 85 id vectors), and the progress.json migration check
  backend:
    name: backend (fmt, clippy, test)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - name: progress.json migration (documented restart flow, synthetic data)
        run: |
          cargo build
          python3 -I ../tests/integration/migrate_check.py target/debug/xexam-backend

  # (2) Build both images on amd64, run the Nginx behaviour checks and the full-stack end-to-end check (compose up, import, submit, data survives removing the containers, docker stop)
  stack:
    name: stack (images, nginx checks, end to end)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the frontend image and run the proxy checks
        run: |
          docker build -f nginx/Dockerfile -t xexam-frontend:test .
          python3 -I tests/integration/nginx_check.py xexam-frontend:test 18080
      - name: End to end (compose up, import, attempts, persistence, docker stop)
        run: python3 -I tests/integration/stack_check.py 18090

  # (2) arm64: both images are really built and really started under QEMU (the backend is cross-compiled with zig on the build machine, not compiled as Rust inside QEMU).
  #    Private repositories cannot use GitHub's native arm64 runners, so running is emulated with QEMU. Build only, no push; discarded afterwards.
  arm64:
    name: arm64 (images build and start under QEMU)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build xexam-backend (arm64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: xexam-backend:arm64
          cache-from: type=gha,scope=backend-arm64-check
          cache-to: type=gha,scope=backend-arm64-check,mode=max
      - name: Build xexam-frontend (arm64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: xexam-frontend:arm64
          cache-from: type=gha,scope=frontend-arm64-check
          cache-to: type=gha,scope=frontend-arm64-check,mode=max
      - name: Start both images and check them
        run: |
          set -eu
          docker volume create arm64data >/dev/null
          docker run -d --name arm64-backend --platform linux/arm64 -v arm64data:/data xexam-backend:arm64 >/dev/null
          for i in $(seq 1 60); do
            docker exec arm64-backend /usr/local/bin/xexam-backend healthcheck >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { docker logs arm64-backend; echo "backend did not become healthy"; exit 1; }
            sleep 2
          done
          info=$(docker exec arm64-backend wget -qO- --header 'Host: localhost' http://127.0.0.1:8765/api/info)
          echo "backend /api/info: $info"
          echo "$info" | grep -q '"arch": "aarch64"' || { echo "backend is not running as aarch64"; exit 1; }
          echo "$info" | grep -q '"version": "'"$(tr -d '[:space:]' < VERSION)"'"' || { echo "version mismatch"; exit 1; }
          docker run -d --name arm64-frontend --platform linux/arm64 xexam-frontend:arm64 >/dev/null
          for i in $(seq 1 30); do
            docker exec arm64-frontend wget -qO- http://127.0.0.1:8080/healthz 2>/dev/null | grep -q '^ok' && break
            [ "$i" = 30 ] && { docker logs arm64-frontend; echo "frontend did not answer /healthz"; exit 1; }
            sleep 1
          done
          [ "$(docker exec arm64-frontend uname -m)" = "aarch64" ] || { echo "frontend is not aarch64"; exit 1; }
          docker exec arm64-frontend wget -qO- http://127.0.0.1:8080/index.html | grep -qi '<div id="app"\|<title>' || { echo "frontend does not serve index.html"; exit 1; }
          echo "arm64: both images build and start"
      - name: Clean up
        if: always()
        run: |
          docker rm -f arm64-backend arm64-frontend >/dev/null 2>&1 || true
          docker volume rm arm64data >/dev/null 2>&1 || true

  # (3) Only when every check has passed are the two images (amd64 + arm64) published, to Docker Hub (public; what
  #     docker/docker-compose.yml pulls) and to ghcr.io (same tags, a mirror). Published from main only; pull requests and other
  #     branches never publish. Docker Hub needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access
  #     token with Read & Write). The namespace is DOCKERHUB_USERNAME, or the repository variable DOCKERHUB_NAMESPACE if set.
  publish:
    name: publish ${{ matrix.image }} (amd64 + arm64)
    needs: [check, frontend, backend, stack, arm64]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write          # needed to push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: xexam-backend
            dockerfile: backend/Dockerfile
          - image: xexam-frontend
            dockerfile: nginx/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # Image names must be all lowercase, but the GitHub user name may contain capitals (Yumin-Space), so convert it first.
      # Without the Docker Hub secrets the job stops here, before anything is pushed: docker/docker-compose.yml pulls from Docker Hub,
      # so publishing only to ghcr.io would leave a release that the default setup cannot pull.
      - name: Image names
        env:
          VERSION: ${{ needs.check.outputs.version }}
          NAME: ${{ matrix.image }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -eu
          if [ -z "$HUB_USER" ] || [ -z "$HUB_TOKEN" ]; then
            echo "::error::Docker Hub secrets missing: add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN under Settings > Secrets and variables > Actions"
            exit 1
          fi
          ns="${HUB_NAMESPACE:-$HUB_USER}"
          # docker/docker-compose.yml and the READMEs name the Docker Hub images; they must match the namespace pushed to
          grep -q "image: docker.io/${ns,,}/$NAME:latest" docker/docker-compose.yml || {
            echo "::error::docker/docker-compose.yml does not pull docker.io/${ns,,}/$NAME:latest (wrong DOCKERHUB_USERNAME / DOCKERHUB_NAMESPACE, or the file names another namespace)"
            exit 1
          }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$NAME" >> "$GITHUB_ENV"
          echo "HUB_IMAGE=docker.io/${ns,,}/$NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest = the most recent build; vX.Y = this version; sha-xxxx = this commit (never overwritten)
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.HUB_IMAGE }}
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ env.VERSION }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=v${{ env.VERSION }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          provenance: false        # no extra unknown/unknown entry, so tools such as Synology, Raspberry Pi and Portainer do not break
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-publish
          cache-to: type=gha,scope=${{ matrix.image }}-publish,mode=max

      # After publishing, look back once at both registries: read the manifest by "the digest just pushed"; it must contain both amd64 and arm64
      - name: Verify published manifest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          [ -n "$DIGEST" ] || { echo "Could not get the digest of the pushed image"; exit 1; }
          for img in "$HUB_IMAGE" "$IMAGE"; do
            out=$(docker buildx imagetools inspect "$img@$DIGEST")
            echo "$out"
            echo "$out" | grep -Eq 'Platform: +linux/amd64' || { echo "$img is missing amd64"; exit 1; }
            echo "$out" | grep -Eq 'Platform: +linux/arm64' || { echo "$img is missing arm64"; exit 1; }
            # The first "Digest:" line of the default output is the digest of this tag (the top-level manifest)
            for t in latest "v$VERSION"; do
              got=$(docker buildx imagetools inspect "$img:$t" | awk '/^Digest:/{print $2; exit}')
              [ "$got" = "$DIGEST" ] || { echo "Tag $t of $img does not point to the image just pushed ($got vs $DIGEST)"; exit 1; }
            done
            echo "Published: $img:latest and $img:v$VERSION, both containing amd64 and arm64 (digest $DIGEST)"
          done

  # (4) After both images are published and verified, create (or update) the Release of this version on GitHub's Releases page.
  #    The notes come from the changelog of the English README (scripts/release-notes.py), so the Release page and the README always agree.
  #    If the images were not published this job is never reached, so the Release page never shows a version whose images cannot be pulled.
  release:
    name: GitHub release
    needs: [check, publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # needed to create the Release and the git tag
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      - uses: actions/checkout@v7

      - name: Create or update the release
        run: |
          set -eu
          ns="${HUB_NAMESPACE:-$HUB_USER}"
          # Docker Hub first (what docker/docker-compose.yml pulls), ghcr.io as the mirror
          python3 scripts/release-notes.py "$VERSION" "docker.io/${ns,,},ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" README.md > notes.md
          tag="v$VERSION"
          title="Xexam v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the same version (e.g. only the notes changed): update the notes, leave the tag alone
            gh release edit "$tag" --title "$title" --notes-file notes.md --latest
            echo "Updated Release: $tag"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
            echo "Created Release: $tag (for commit $GITHUB_SHA)"
          fi
          gh release view "$tag" --json url,tagName,targetCommitish --jq '"\(.tagName) -> \(.url)"'
