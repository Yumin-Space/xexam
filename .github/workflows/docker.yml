name: Build, test and publish image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认不给任何权限；需要的权限下面在 job 里单独开
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # main 上排队不取消，免得发布到一半被打断

env:
  # 不把构建记录上传成 artifact（每次多两个 .dockerbuild 文件，没用）
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # ① 检查：VERSION 格式正确，且 README 更新日志最上面一条 = VERSION。几秒钟，不通过就不用往下跑。
  check:
    name: check version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Check version and changelog
        run: |
          set -eu
          v=$(tr -d '[:space:]' < VERSION)
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "VERSION 格式不对：$v（应像 0.1 或 0.1.2）"; exit 1; }
          top=$(grep -m1 -E '^### v[0-9]' README.md | sed -E 's/^### v([0-9][0-9.]*).*$/\1/')
          [ "$top" = "$v" ] || { echo "README 更新日志最上面一条是 v${top:-（没找到）}，但 VERSION 是 $v。每次更新都要先在 README 里写更新日志，并和 VERSION 保持一致。"; exit 1; }
          echo "版本 v$v，更新日志已写"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # ② 两种 CPU 架构各自构建、各自跑一遍冒烟测试（scripts/smoke-test.sh）。
  #    x86 服务器/电脑用 amd64，ARM 服务器/树莓派/苹果芯片用 arm64。arm64 在标准 runner 上用 QEMU 模拟运行。
  test:
    name: test (${{ matrix.short }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            short: amd64
          - platform: linux/arm64
            short: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: matrix.short == 'arm64'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          tags: xexam:test
          cache-from: type=gha,scope=${{ matrix.short }}
          cache-to: type=gha,scope=${{ matrix.short }},mode=max

      - name: Smoke test
        run: bash scripts/smoke-test.sh xexam:test "${{ matrix.short }}"

  # ③ 两种架构的测试都通过，才把「amd64 + arm64」合成一个镜像发布。拉取请求只测试，不发布。
  publish:
    name: publish (amd64 + arm64)
    needs: [check, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'   # 只从 main 发布
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write          # 推送到 ghcr.io 需要
    steps:
      - uses: actions/checkout@v7

      # 镜像名必须全小写，而 GitHub 用户名可能有大写（Yumin-Space），所以先转成小写
      - name: Image name
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eu
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xexam" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = 最新一次构建；vX.Y = 这个版本；sha-xxxx = 这次提交（不会被覆盖）
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v${{ env.VERSION }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=v${{ env.VERSION }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false        # 不额外生成 unknown/unknown 条目，群晖、树莓派、Portainer 等工具才不会出问题
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      # 发布完回头看一眼：按「刚推送的那个摘要」读镜像清单，必须同时有 amd64 和 arm64
      - name: Verify published manifest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          [ -n "$DIGEST" ] || { echo "没有拿到推送的摘要"; exit 1; }
          out=$(docker buildx imagetools inspect "$IMAGE@$DIGEST")
          echo "$out"
          echo "$out" | grep -Eq 'Platform: +linux/amd64' || { echo "发布的镜像缺少 amd64"; exit 1; }
          echo "$out" | grep -Eq 'Platform: +linux/arm64' || { echo "发布的镜像缺少 arm64"; exit 1; }
          # 默认输出的第一个 Digest: 行就是这个标签（顶层清单）的摘要
          for t in latest "v$VERSION"; do
            got=$(docker buildx imagetools inspect "$IMAGE:$t" | awk '/^Digest:/{print $2; exit}')
            [ "$got" = "$DIGEST" ] || { echo "标签 $t 指向的不是刚推送的镜像（$got 与 $DIGEST）"; exit 1; }
          done
          echo "已发布：$IMAGE:latest 和 $IMAGE:v$VERSION，同时包含 amd64 和 arm64（摘要 $DIGEST）"

  # ④ 镜像发布并核对成功之后，在 GitHub 的 Releases 页建（或更新）这个版本的 Release。
  #    说明文字取自 README 的「更新日志」（scripts/release-notes.py），所以 Release 页和 README 永远是同一份内容。
  #    Release 对应的是 main 上这次提交；版本号 = VERSION。镜像没发布成功就不会走到这里，Release 页上不会出现拉不到镜像的版本。
  release:
    name: GitHub release
    needs: [check, publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # 创建 Release 和 git 标签需要
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Create or update the release
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xexam"
          python3 scripts/release-notes.py "$VERSION" "$image" README.md > notes.md
          tag="v$VERSION"
          title="Xexam v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            # 同一个版本重新跑（例如只改了说明）：更新说明，不动标签
            gh release edit "$tag" --title "$title" --notes-file notes.md --latest
            echo "已更新 Release：$tag"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --latest
            echo "已创建 Release：$tag（对应提交 $GITHUB_SHA）"
          fi
          gh release view "$tag" --json url,tagName,targetCommitish --jq '"\(.tagName) -> \(.url)"'
