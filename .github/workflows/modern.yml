name: Modern stack (Rust + TypeScript + Nginx)

# 新架构的检查。只在分支 modernize/** 和对 main 的拉取请求上跑，**从不发布镜像**：
# 发布仍由 docker.yml 在 main 上负责（切换提交之后再把发布逻辑接过来）。
on:
  push:
    branches: ['modernize/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  CARGO_TERM_COLOR: never

jobs:
  frontend:
    name: frontend (tsc, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Tests (the Python oracle must really run, not be skipped)
        env:
          XEXAM_REQUIRE_PYTHON: "1"
        run: |
          python3 --version
          cargo test --all-targets
      - name: progress.json migration (documented restart flow, synthetic data)
        run: |
          cargo build
          python3 -I ../tests/integration/migrate_check.py target/debug/xexam-backend

  stack:
    name: stack (images, nginx checks, end to end)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the nginx image and run the proxy checks
        run: |
          docker build -f nginx/Dockerfile -t xexam-web:test .
          python3 -I tests/integration/nginx_check.py xexam-web:test 18080
      - name: End to end (compose up, import, attempts, persistence, docker stop)
        run: python3 -I tests/integration/stack_check.py 18090

  # arm64：两个新镜像在 QEMU 下真的构建、真的跑起来（树莓派 / Apple 芯片 / 云上 ARM 服务器会用到）。
  # 私有仓库用不了 GitHub 的原生 arm64 runner，所以用 QEMU 模拟：比原生慢（Rust 编译要几十分钟），但能证明能构建、能启动。
  # 只构建、不推送；用完即弃。
  arm64:
    name: arm64 (images build and start under QEMU)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build xexam-backend (arm64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: xexam-backend:arm64
          cache-from: type=gha,scope=modern-backend-arm64
          cache-to: type=gha,scope=modern-backend-arm64,mode=max
      - name: Build xexam-web (arm64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: nginx/Dockerfile
          platforms: linux/arm64
          load: true
          provenance: false
          tags: xexam-web:arm64
          cache-from: type=gha,scope=modern-web-arm64
          cache-to: type=gha,scope=modern-web-arm64,mode=max
      - name: Start both images and check them
        run: |
          set -eu
          docker volume create arm64data >/dev/null
          docker run -d --name arm64-backend --platform linux/arm64 -v arm64data:/data xexam-backend:arm64 >/dev/null
          for i in $(seq 1 60); do
            docker exec arm64-backend /usr/local/bin/xexam-backend healthcheck >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { docker logs arm64-backend; echo "backend did not become healthy"; exit 1; }
            sleep 2
          done
          info=$(docker exec arm64-backend wget -qO- --header 'Host: localhost' http://127.0.0.1:8765/api/info)
          echo "backend /api/info: $info"
          echo "$info" | grep -q '"arch": "aarch64"' || { echo "backend is not running as aarch64"; exit 1; }
          echo "$info" | grep -q '"version": "'"$(tr -d '[:space:]' < VERSION)"'"' || { echo "version mismatch"; exit 1; }
          docker run -d --name arm64-web --platform linux/arm64 xexam-web:arm64 >/dev/null
          for i in $(seq 1 30); do
            docker exec arm64-web wget -qO- http://127.0.0.1:8080/healthz 2>/dev/null | grep -q '^ok' && break
            [ "$i" = 30 ] && { docker logs arm64-web; echo "web did not answer /healthz"; exit 1; }
            sleep 1
          done
          [ "$(docker exec arm64-web uname -m)" = "aarch64" ] || { echo "web is not aarch64"; exit 1; }
          docker exec arm64-web wget -qO- http://127.0.0.1:8080/index.html | grep -qi '<div id="app"\|<title>' || { echo "web does not serve index.html"; exit 1; }
          echo "arm64: both images build and start"
      - name: Clean up
        if: always()
        run: |
          docker rm -f arm64-backend arm64-web >/dev/null 2>&1 || true
          docker volume rm arm64data >/dev/null 2>&1 || true
