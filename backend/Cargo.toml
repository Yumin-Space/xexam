[package]
name = "xexam-backend"
version = "0.7.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"
publish = false
description = "Xexam backend (Axum + SQLite), a Rust port of the Python implementation kept in legacy/python"

[[bin]]
name = "xexam-backend"
path = "src/main.rs"

[lib]
name = "xexam_backend"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["trace", "timeout", "catch-panic", "limit"] }
http-body-util = "0.1.5"
bytes = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
regex = "1.13.1"
sha1 = "0.11.0"
getrandom = "0.4.3"
subtle = "2.6.1"
percent-encoding = "2.3"
jiff = "0.2.41"
argon2 = "0.6.0"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3"
http-body-util = { version = "0.1.5", features = ["channel"] }

# Argon2 is slow without optimisation; tests (debug builds) hash passwords too
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
