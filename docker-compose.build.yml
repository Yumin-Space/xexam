# Xexam —— 从源码构建两个镜像并运行（改代码时用）。
#
#     docker compose -f docker-compose.build.yml up -d --build
#
# 和 docker-compose.yml 用同一个项目名（xexam）、同一个卷（xexam_data）、同样的容器名，所以两者不能同时运行；
# 切换前先 `docker compose stop`。数据是同一份。
#
#   浏览器 ──> xexam-frontend（Nginx，唯一对外的入口，:8080 → 宿主机 XEXAM_BIND）
#                 ├─ 前端静态文件（构建时放进镜像）
#                 └─ /api/ ──> xexam-backend（私有网络，不发布端口）──> SQLite（命名卷 xexam_data → /data/xexam.db）

name: xexam

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: xexam-backend:local
    container_name: xexam-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      XEXAM_ALLOWED_HOSTS: "${XEXAM_ALLOWED_HOSTS:-}"
      XEXAM_ALLOWED_ORIGINS: "${XEXAM_ALLOWED_ORIGINS:-}"
      XEXAM_ALLOW_ANY_HOST: "${XEXAM_ALLOW_ANY_HOST:-0}"
      XEXAM_PARSE_TIMEOUT_SECS: "${XEXAM_PARSE_TIMEOUT_SECS:-30}"
    volumes:
      - data:/data
    networks: [internal]
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: xexam-frontend:local
    container_name: xexam-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${XEXAM_BIND:-127.0.0.1:8765}:8080"
    networks: [internal, public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]

networks:
  internal:
    internal: true
  public: {}

volumes:
  data:
