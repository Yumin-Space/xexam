# 新架构（Nginx + Rust 后端 + SQLite）。切换提交之后这个文件会改名成 docker-compose.yml。
#
#   浏览器 ──> nginx（唯一对外的入口，:8080 → 宿主机 XEXAM_BIND）
#                 ├─ 前端静态文件（构建时放进镜像）
#                 └─ /api/ ──> backend（私有网络，不发布端口）──> SQLite（命名卷 xexam_data → /data/xexam.db）
#
# 从源码构建并启动：   docker compose -f docker-compose.modern.yml up -d --build
# 和旧的 Python 版同名（项目名 xexam、容器名 xexam、卷 xexam_data），所以两者不能同时运行；回滚 = 停这个，起旧的。

name: xexam

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: xexam-backend:local
    container_name: xexam-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      XEXAM_ALLOWED_HOSTS: "${XEXAM_ALLOWED_HOSTS:-}"
      XEXAM_ALLOWED_ORIGINS: "${XEXAM_ALLOWED_ORIGINS:-}"
      XEXAM_ALLOW_ANY_HOST: "${XEXAM_ALLOW_ANY_HOST:-0}"
      XEXAM_PARSE_TIMEOUT_SECS: "${XEXAM_PARSE_TIMEOUT_SECS:-30}"
    volumes:
      # 题库和学习记录都在这个命名卷里的 xexam.db；删除或更新容器都不会丢
      - data:/data
    networks: [internal]
    # 注意：没有 ports。后端只在私有网络里，从宿主机和外部都连不到。
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: xexam-web:local
    container_name: xexam
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 默认只绑定本机。在 .env 里设 XEXAM_BIND=0.0.0.0:8765 才会让局域网里别的机器连得到。
      - "${XEXAM_BIND:-127.0.0.1:8765}:8080"
    networks: [internal, public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]

networks:
  # 后端所在的私有网络：不能访问外部网络，外部也进不来
  internal:
    internal: true
  public: {}

volumes:
  data:
