# Xexam — run the two images that GitHub builds automatically, pulled directly from Docker Hub (public, no login needed).
# On any machine, you only need this one file:
#     docker compose up -d
# (The same images are also on ghcr.io/yumin-space as a private mirror; that one needs docker login ghcr.io first.)
# Then open http://localhost:8765 in a browser
#
#   Browser ──> xexam-frontend (Nginx, the only externally exposed entry point)
#                 ├─ frontend static files (baked into the image at build time)
#                 └─ /api/ ──> xexam-backend (Rust, private network, no published port) ──> SQLite (named volume xexam_data → /data/xexam.db)
#
# Update to the latest version:   docker compose pull && docker compose up -d
# Stop / start again:    docker compose stop  /  docker compose start
# To build from source (use when changing code): docker compose -f docker-compose.build.yml up -d --build
#
# To access it through your own domain (Cloudflare Tunnel + Cloudflare Access):
#   Create a file named .env next to this file and write:
#       XEXAM_BIND=0.0.0.0:8765            # lets cloudflared on the LAN reach this machine; the default binds to localhost only
#       XEXAM_ALLOWED_HOSTS=xexam.your-domain.com
#   Then run docker compose up -d. See the README and docs/en/deployment.md for full instructions.
#
# ⚠️ Do not run `docker compose down -v`: -v also deletes the data volume xexam_data.

name: xexam                          # Compose project name: pinned so it is the same no matter which folder it lives in

services:
  backend:
    image: docker.io/yuminspace/xexam-backend:latest
    container_name: xexam-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      XEXAM_ALLOWED_HOSTS: "${XEXAM_ALLOWED_HOSTS:-}"
      XEXAM_ALLOWED_ORIGINS: "${XEXAM_ALLOWED_ORIGINS:-}"
      XEXAM_ALLOW_ANY_HOST: "${XEXAM_ALLOW_ANY_HOST:-0}"
      XEXAM_PARSE_TIMEOUT_SECS: "${XEXAM_PARSE_TIMEOUT_SECS:-30}"
    volumes:
      # The question bank and study records all live in xexam.db in this named volume; deleting or updating the container does not lose them
      - data:/data
    networks: [internal]
    # Note: there are no ports. The backend is only on the private network and cannot be reached from the host or from outside.
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]

  frontend:
    image: docker.io/yuminspace/xexam-frontend:latest
    container_name: xexam-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # By default it binds to localhost only. Set XEXAM_BIND=0.0.0.0:8765 in .env to let other machines on the LAN connect.
      - "${XEXAM_BIND:-127.0.0.1:8765}:8080"
    networks: [internal, public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]

networks:
  # Private network for the backend: it cannot reach external networks, and external hosts cannot get in
  internal:
    internal: true
  public: {}

volumes:
  data:
