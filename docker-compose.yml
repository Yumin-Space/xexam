# xexam —— 直接拉取 GitHub 自动构建好的镜像运行。
# 在任何机器上，只需要这一个文件：
#     docker login ghcr.io -u Yumin-Space      （第一次；镜像是私有的，密码填有 read:packages 权限的令牌）
#     docker compose up -d
# 然后浏览器打开  http://localhost:8765
#
# 更新到最新版本：   docker compose pull && docker compose up -d
# 停止 / 再启动：    docker compose stop  /  docker compose start
# 想从源码构建（改代码时用）：docker compose -f docker-compose.build.yml up -d --build
#
# 想通过自己的域名访问（Cloudflare Tunnel + Cloudflare Access）：
#   在这个文件旁边建一个叫 .env 的文件，写：
#       XEXAM_BIND=0.0.0.0:8765            # 让局域网里的 cloudflared 能连到这台机器；默认是只绑定本机
#       XEXAM_ALLOWED_HOSTS=xexam.你的域名.com
#   然后 docker compose up -d。完整说明见 README 的「通过 Cloudflare Tunnel 从互联网访问」。

name: xexam                          # Compose 项目名：固定下来，放在哪个文件夹都一样

services:
  xexam:
    image: ghcr.io/yumin-space/xexam:latest
    container_name: xexam
    restart: unless-stopped
    ports:
      # 默认只绑定本机（安全）。在 .env 里设 XEXAM_BIND=0.0.0.0:8765 才会让局域网里别的机器连得到。
      - "${XEXAM_BIND:-127.0.0.1:8765}:8765"
    volumes:
      # 题库和学习记录都在这个卷里的 xexam.db。卷由 Docker 管理，删除或更新容器都不会丢。
      # 真实名字是 xexam_data（项目名_卷名），用 docker volume ls 能看到。
      - data:/data
    environment:
      TZ: Asia/Tokyo
      # 允许用哪些域名/地址访问。逗号分隔，可以写域名、IP，带不带端口都行。留空 = 只允许本机。
      XEXAM_ALLOWED_HOSTS: "${XEXAM_ALLOWED_HOSTS:-}"
      # 反向代理把 Host 改写成源站地址（cloudflared 设了 HTTP Host Header）时，才需要填这个：你的公网域名。
      XEXAM_ALLOWED_ORIGINS: "${XEXAM_ALLOWED_ORIGINS:-}"
      # 1 = 不再检查 Host。只在前面已经有身份验证（Cloudflare Access）、又懒得列域名时用。默认 0。
      XEXAM_ALLOW_ANY_HOST: "${XEXAM_ALLOW_ANY_HOST:-0}"

volumes:
  data:
