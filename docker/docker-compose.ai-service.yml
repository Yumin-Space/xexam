# Xexam on different machines — MACHINE 3: ai-service (AI Chat, hints, analysis, summaries, generation; Rust + SQLite).
# Use this file together with docker-compose.frontend.yml (machine 1) and docker-compose.backend.yml (machine 2). Full guide: docs/en/deployment.md, section 12.
# This machine needs outbound internet (the AI provider) and a route to the backend machine; it has its own database volume.
#
# On this machine, create a file named .env next to this file (the template is .env.example) with at least:
#       XEXAM_AI_BIND=10.0.0.3:8766            # this machine's private address; the frontend's XEXAM_AI_UPSTREAM points here
#       XEXAM_AI_BACKEND_URL=http://10.0.0.2:8765
#       XEXAM_FRONTEND_PEERS=10.0.0.1          # the frontend machine
#       XEXAM_INTERNAL_TOKEN=...               # the same value as on the backend machine
#   Start:   docker compose -f docker-compose.ai-service.yml up -d      (in a clone: -f docker/docker-compose.ai-service.yml)
#   Update:  docker compose -f docker-compose.ai-service.yml pull && docker compose -f docker-compose.ai-service.yml up -d
#
# ⚠️ Do not run `docker compose down -v`: -v also deletes the data volume xexam_ai_data (AI settings, encrypted keys, chats, memories).

name: xexam

services:
  ai-service:
    image: docker.io/yuminspace/xexam-ai-service:latest
    container_name: xexam-ai-service
    restart: unless-stopped
    environment:
      # Not set = the default, the host's time zone (the same as the backend):
      # TZ:  (the host's)
      # Or: TZ:  UTC
      TZ:
      # Not set = the default, a random key file in the AI data volume encrypts the saved AI keys:
      # XEXAM_AI_SECRET_KEY:  (key file)
      # Or: XEXAM_AI_SECRET_KEY:  the output of openssl rand -base64 32 (32 bytes as 64 hex digits or base64)
      XEXAM_AI_SECRET_KEY:
      # Required on separate machines: the same value as on the backend machine (at least 32 printable ASCII characters, no spaces).
      XEXAM_INTERNAL_TOKEN: "${XEXAM_INTERNAL_TOKEN:?set XEXAM_INTERNAL_TOKEN in .env, the same value on the backend and ai-service machines (for example the output of openssl rand -hex 32)}"
      # 1 = ai-service does not start unless the token above is set and valid:
      XEXAM_INTERNAL_TOKEN_REQUIRED: "1"
      # Required: where the main backend is (http:// or https:// plus host and port, no path). ai-service reports its state there:
      # XEXAM_AI_BACKEND_URL:  http://10.0.0.2:8765
      XEXAM_AI_BACKEND_URL: "${XEXAM_AI_BACKEND_URL:?set XEXAM_AI_BACKEND_URL in .env to the backend machine, for example http://10.0.0.2:8765}"
      # Required: the frontend machine's address (or addresses / CIDRs, separated by commas or spaces). Only these peers (and
      # loopback) may use ai-service; everything else gets 404:
      # XEXAM_FRONTEND_PEERS:  10.0.0.1
      XEXAM_FRONTEND_PEERS: "${XEXAM_FRONTEND_PEERS:?set XEXAM_FRONTEND_PEERS in .env to the frontend machine's address, for example 10.0.0.1}"
      # Not set = the default log filter of the AI service:
      # XEXAM_AI_LOG:  info
      # Or: XEXAM_AI_LOG:  debug
      XEXAM_AI_LOG:
      # Not set = the default, the SQLite WAL journal of the AI database:
      # XEXAM_AI_SQLITE_JOURNAL:  (WAL)
      # Or: XEXAM_AI_SQLITE_JOURNAL:  delete (as XEXAM_SQLITE_JOURNAL)
      XEXAM_AI_SQLITE_JOURNAL:
      # Not set = the default, User-Agent xexam-ai-service/<version> on requests to AI providers and gateways:
      # XEXAM_AI_USER_AGENT_NAME:  (xexam-ai-service/<version>)
      # Or: XEXAM_AI_USER_AGENT_NAME:  none (no User-Agent header at all)
      # Or: XEXAM_AI_USER_AGENT_NAME:  MyGateway-Client/1.0 (any name your gateway should see; printable ASCII, at most 256 characters)
      XEXAM_AI_USER_AGENT_NAME:
    volumes:
      # AI settings, encrypted keys, the key file secret.key, chats and memories: xexam-ai.db in this named volume
      - ai_data:/data
      # Follow the host's time zone (read only), the same as the backend
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Required: the PRIVATE address of this machine and the port, never 0.0.0.0 on a machine that has a public address.
      # Docker publishes ports around ufw / firewalld, so XEXAM_FRONTEND_PEERS above is the check that counts.
      # XEXAM_AI_BIND:  10.0.0.3:8766
      - "${XEXAM_AI_BIND:?set XEXAM_AI_BIND in .env to this machine's private address and port, for example 10.0.0.3:8766}:8766"
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    # Docker keeps container logs without any limit by default; keep at most 3 files of 10 MB per container
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ai_data:
