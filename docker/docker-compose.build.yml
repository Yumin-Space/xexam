# Xexam — build the three images from source and run them (use this when changing code). From the repository root:
#
#     docker compose -f docker/docker-compose.build.yml up -d --build
#
# The build context is the repository root (.. from this folder); the Dockerfiles stay in backend/, ai-service/ and nginx/.
# .env is read from this folder (docker/.env, next to this file; the template is docker/.env.example). A .env at the repository
# root is not read: move an old one to docker/.env.
# Uses the same project name (xexam), the same volumes (xexam_data, xexam_ai_data, xexam_link) and the same container names as
# docker-compose.yml, so the two cannot run at the same time; stop the running one before switching (for example
# docker compose -f docker/docker-compose.build.yml stop). The data is the same.
#
#   Browser ──> xexam-frontend (Nginx, the only externally exposed entry point, :8080 → host XEXAM_BIND)
#                 ├─ frontend static files (baked into the image at build time)
#                 ├─ /api/    ──> xexam-backend (private network, no published port, no internet)
#                 │                 └─ SQLite (named volume xexam_data → /data/xexam.db); internal token (xexam_link)
#                 └─ /api/ai/ ──> checked by xexam-backend first, then ──> ai-service (no published port)
#                                   ├─ reports its state to the backend (at start, on changes, every 25 s)
#                                   └─ SQLite + key file (named volume xexam_ai_data → /data); internet (egress) only here
#
# ⚠️ `docker compose down -v` deletes the two data volumes xexam_data and xexam_ai_data as well.

name: xexam

services:
  backend:
    build:
      context: ..                      # the repository root (paths are relative to this file)
      dockerfile: backend/Dockerfile
    image: xexam-backend:local
    container_name: xexam-backend
    restart: unless-stopped
    environment:
      # Time zone of the timestamps: by default the host's (its /etc/localtime is mounted below). Only a TZ set in .env
      # (for example TZ=UTC) overrides it; with no value here, Compose does not set TZ at all inside the container.
      TZ:
      XEXAM_ALLOWED_HOSTS: "${XEXAM_ALLOWED_HOSTS:-}"
      XEXAM_ALLOWED_ORIGINS: "${XEXAM_ALLOWED_ORIGINS:-}"
      XEXAM_ALLOW_ANY_HOST: "${XEXAM_ALLOW_ANY_HOST:-0}"
      XEXAM_PARSE_TIMEOUT_SECS: "${XEXAM_PARSE_TIMEOUT_SECS:-30}"
      # SQLite journal: WAL by default. Only XEXAM_SQLITE_JOURNAL=delete set in .env (for unusual storage such as a network
      # filesystem) keeps the old DELETE mode; with no value here, Compose does not set it at all inside the container.
      XEXAM_SQLITE_JOURNAL:
      # 1 = the session cookies always get Secure (behind an HTTPS proxy such as Cloudflare Tunnel). Only a value set in .env
      # is passed in; with no value here, Compose does not set it inside the container (Secure then follows the request).
      XEXAM_COOKIE_SECURE:
      # The backend's log filter (default info, also when empty; for example XEXAM_LOG=debug). Only a value set in .env is passed in.
      XEXAM_LOG:
      # The token the backend and ai-service use between them. Leave it unset: the backend creates a random one in the link
      # volume. Only a value set in .env (at least 32 printable ASCII characters without spaces, e.g. the output of
      # openssl rand -hex 32; the same for both services) is passed in.
      XEXAM_INTERNAL_TOKEN:
    volumes:
      - data:/data
      # Holds only internal.token (never a database), which ai-service reads
      - link:/link
      # Follow the host's time zone (read only). Docker shares the host's clock anyway; this only gives the same zone.
      # create_host_path: false = on a host without /etc/localtime, Compose stops with "bind source path does not exist"
      # instead of creating an empty folder there (which cannot be mounted over the image's file). On such a host, remove
      # these six lines (here and under ai-service) and set TZ in .env instead.
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    networks: [internal]
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    # Docker keeps container logs without any limit by default; keep at most 3 files of 10 MB per container
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ai-service:
    build:
      context: ..                      # the repository root (paths are relative to this file)
      dockerfile: ai-service/Dockerfile
    image: xexam-ai-service:local
    container_name: ai-service
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Same rule as for the backend: the host's time zone unless TZ is set in .env
      TZ:
      # The key that encrypts the saved AI provider keys. Leave it unset: a random key file is created in the AI data volume.
      # Only a value set in .env (32 bytes as 64 hex digits or base64, for example from openssl rand -base64 32) is passed in.
      XEXAM_AI_SECRET_KEY:
      # Must be the same value as for the backend (or unset in both): at least 32 printable ASCII characters, no spaces
      XEXAM_INTERNAL_TOKEN:
      # The AI service's log filter (default info). Only a value set in .env is passed in.
      XEXAM_AI_LOG:
      # SQLite journal of the AI database: WAL by default; XEXAM_AI_SQLITE_JOURNAL=delete set in .env keeps the DELETE mode.
      XEXAM_AI_SQLITE_JOURNAL:
    volumes:
      - ai_data:/data
      # internal.token written by the backend (read only here)
      - link:/link:ro
      # Follow the host's time zone (read only), the same as the backend
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    # internal: Nginx and the backend; egress: outbound internet, for the AI provider only (the backend has none)
    networks: [internal, egress]
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    # Docker keeps container logs without any limit by default; keep at most 3 files of 10 MB per container
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ..                      # the repository root (paths are relative to this file)
      dockerfile: nginx/Dockerfile
    image: xexam-frontend:local
    container_name: xexam-frontend
    restart: unless-stopped
    # Only the backend: the app starts and works without ai-service
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${XEXAM_BIND:-127.0.0.1:8765}:8080"
    networks: [internal, public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    # Docker keeps container logs without any limit by default; keep at most 3 files of 10 MB per container
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal:
    internal: true
  public: {}
  # Outbound internet for ai-service only (to reach the AI provider)
  egress: {}

volumes:
  data:
  ai_data:
  link:
