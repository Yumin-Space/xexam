# Xexam — run the two images that GitHub builds automatically, pulled directly from Docker Hub (public, no login needed).
# On a server you only need this one file: put it in a folder of its own and, in that folder, run
#     docker compose up -d
# In a clone of the repository this file is docker/docker-compose.yml; run it from the repository root with
#     docker compose -f docker/docker-compose.yml up -d
# and add the same -f docker/docker-compose.yml to the other docker compose commands below.
# (The same images are also on ghcr.io/yumin-space as a private mirror; that one needs docker login ghcr.io first.)
# Then open http://localhost:8765 in a browser
#
#   Browser ──> xexam-frontend (Nginx, the only externally exposed entry point)
#                 ├─ frontend static files (baked into the image at build time)
#                 └─ /api/ ──> xexam-backend (Rust, private network, no published port) ──> SQLite (named volume xexam_data → /data/xexam.db)
#
# Update to the latest version:   docker compose pull && docker compose up -d
# Stop / start again:    docker compose stop  /  docker compose start
# To build from source (use when changing code), from the repository root: docker compose -f docker/docker-compose.build.yml up -d --build
#
# To access it through your own domain (Cloudflare Tunnel + Cloudflare Access):
#   Create a file named .env next to this file (in a clone: docker/.env, a .env at the repository root is not read; the template is .env.example in the same folder) and write:
#       XEXAM_BIND=0.0.0.0:8765            # lets cloudflared on the LAN reach this machine; the default binds to localhost only
#       XEXAM_ALLOWED_HOSTS=xexam.your-domain.com
#   Then run docker compose up -d. See the README and docs/en/deployment.md for full instructions.
#
# ⚠️ Do not run `docker compose down -v`: -v also deletes the data volume xexam_data.

name: xexam                          # Compose project name: pinned so it is the same no matter which folder it lives in (volume xexam_data, containers xexam-*)

services:
  backend:
    image: docker.io/yuminspace/xexam-backend:latest
    container_name: xexam-backend
    restart: unless-stopped
    environment:
      # Time zone of the timestamps: by default the host's (its /etc/localtime is mounted below). Only a TZ set in .env
      # (for example TZ=UTC) overrides it; with no value here, Compose does not set TZ at all inside the container.
      TZ:
      XEXAM_ALLOWED_HOSTS: "${XEXAM_ALLOWED_HOSTS:-}"
      XEXAM_ALLOWED_ORIGINS: "${XEXAM_ALLOWED_ORIGINS:-}"
      XEXAM_ALLOW_ANY_HOST: "${XEXAM_ALLOW_ANY_HOST:-0}"
      XEXAM_PARSE_TIMEOUT_SECS: "${XEXAM_PARSE_TIMEOUT_SECS:-30}"
      # SQLite journal: WAL by default. Only XEXAM_SQLITE_JOURNAL=delete set in .env (for unusual storage such as a network
      # filesystem) keeps the old DELETE mode; with no value here, Compose does not set it at all inside the container.
      XEXAM_SQLITE_JOURNAL:
      # 1 = the session cookies always get Secure (behind an HTTPS proxy such as Cloudflare Tunnel). Only a value set in .env
      # is passed in; with no value here, Compose does not set it inside the container (Secure then follows the request).
      XEXAM_COOKIE_SECURE:
      # The backend's log filter (default info, for example XEXAM_LOG=debug). Only a value set in .env is passed in.
      XEXAM_LOG:
    volumes:
      # The question bank and study records all live in xexam.db in this named volume; deleting or updating the container does not lose them
      - data:/data
      # Follow the host's time zone (read only). Docker shares the host's clock anyway; this only gives the same zone.
      # create_host_path: false = on a host without /etc/localtime, Compose stops with "bind source path does not exist"
      # instead of creating an empty folder there (which cannot be mounted over the image's file). On such a host, remove
      # these six lines and set TZ in .env instead.
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    networks: [internal]
    # Note: there are no ports. The backend is only on the private network and cannot be reached from the host or from outside.
    stop_grace_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    # Docker keeps container logs without any limit by default; keep at most 3 files of 10 MB per container
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    image: docker.io/yuminspace/xexam-frontend:latest
    container_name: xexam-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # By default it binds to localhost only. Set XEXAM_BIND=0.0.0.0:8765 in .env to let other machines on the LAN connect.
      - "${XEXAM_BIND:-127.0.0.1:8765}:8080"
    networks: [internal, public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp"]
    # Docker keeps container logs without any limit by default; keep at most 3 files of 10 MB per container
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Private network for the backend: it cannot reach external networks, and external hosts cannot get in
  internal:
    internal: true
  public: {}

volumes:
  data:
