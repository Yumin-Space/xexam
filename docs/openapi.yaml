openapi: 3.0.3
info:
  title: Xexam API
  version: "0.3"
  description: |
    The REST API of Xexam. This document describes the **actual behavior of the legacy Python implementation**, and the new
    Rust backend stays consistent with it (172 golden responses compared item by item, see tests/baseline/). The intentional
    differences are listed under "Differences from the old version" in docs/api.md.

    All responses carry `Cache-Control: no-store` and `X-Content-Type-Options: nosniff`.
    JSON is UTF-8 and the key order is fixed (see the order of the properties in each schema).
    Errors are always `{"error": "<reason, in Chinese>"}`.

    **Guard order (POST)**: Host → Origin → Content-Type → request body size → JSON parsing → routing.
    GET only checks Host.
servers:
  - url: http://localhost:8765
    description: Local machine (through Nginx)
tags:
  - name: read
  - name: import
  - name: progress
  - name: system

paths:
  /api/info:
    get:
      tags: [system]
      summary: Version, architecture, whether shutdown is allowed, question count
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
        "403": { $ref: "#/components/responses/ForbiddenHost" }
  /api/bank:
    get:
      tags: [read]
      summary: Question bank (active questions only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bank" }
        "403": { $ref: "#/components/responses/ForbiddenHost" }
  /api/progress:
    get:
      tags: [progress]
      summary: Study records (per-question statistics + scores of the 60 most recent exams)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "403": { $ref: "#/components/responses/ForbiddenHost" }
  /api/imports:
    get:
      tags: [import]
      summary: The 12 most recent import records (newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports:
                    type: array
                    items: { $ref: "#/components/schemas/ImportRecord" }
        "403": { $ref: "#/components/responses/ForbiddenHost" }

  /api/upload:
    post:
      tags: [import]
      summary: "Upload an .xlsx and get a preview (**nothing is written to the database**) and a one-time confirmation code"
      description: |
        The request body is the raw bytes of the .xlsx, at most 20 MiB (counted in real bytes; Content-Length is not trusted).
        Whether it is an .xlsx is judged only by its **content** (magic number + ZIP + workbook + no DOCTYPE / entity declarations),
        never by the file name. The parsed result is held in memory in **one single slot** (uploading again replaces it) and stays
        valid for 30 minutes.
      parameters:
        - name: X-Filename
          in: header
          required: false
          description: 'Percent-encoded file name; defaults to `未命名.xlsx` ("Untitled.xlsx"), at most 120 characters'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Denied" }
        "413":
          description: Larger than 20 MiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/BadContentType" }
  /api/import/confirm:
    post:
      tags: [import]
      summary: Confirm the import (the only endpoint that writes the question bank)
      description: |
        The confirmation code is **single-use**: it is invalidated immediately after a success; a wrong confirmation code does not
        consume what is in the slot; an expired one (30 minutes) cannot be retrieved.
        The import is done in **one transaction**; if it fails, the question bank is left completely unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The import result and the latest question bank
          content:
            application/json:
              schema:
                type: object
                required: [result, bank]
                properties:
                  result: { $ref: "#/components/schemas/ImportPlan" }
                  bank: { $ref: "#/components/schemas/Bank" }
        "400":
          description: This file contains no usable questions (nothing is imported)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Denied" }
        "409":
          description: The preview has expired or was already handled (this includes a wrong or non-ASCII confirmation code)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/BadContentType" }
        "500":
          description: Writing to the database failed; the question bank is left completely unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/import/cancel:
    post:
      tags: [import]
      summary: Cancel the pending import (no confirmation code needed)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "403": { $ref: "#/components/responses/Denied" }
        "415": { $ref: "#/components/responses/BadContentType" }

  /api/attempt:
    post:
      tags: [progress]
      summary: "Record the result of one exam (only {question id, correct or not} is accepted, not the content of the answers)"
      description: |
        Sanitizing rules: `results` must be a list (otherwise 400 `成绩的格式不对`, "malformed results"), at most 2000 entries; each
        entry needs a string `id` (truncated to the first 64 characters) and a boolean `correct` (entries that do not qualify are
        dropped); no valid entry → 400 `没有成绩可保存` ("no results to save"). `sheets` accepts only strings (at most 50, each
        truncated to the first 80 characters); a `mode` other than all / weak / retry is treated as all; `seconds` is clamped to
        0..604800 and abnormal values become 0.
        The server **trusts** `correct` and does not check whether the id is in the question bank (same as the legacy version).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttemptRequest" }
      responses:
        "200":
          description: The latest study records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Denied" }
        "415": { $ref: "#/components/responses/BadContentType" }
  /api/reset:
    post:
      tags: [progress]
      summary: Clear the study records (score history and per-question statistics; the question bank is untouched)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The study records after clearing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "403": { $ref: "#/components/responses/Denied" }
        "415": { $ref: "#/components/responses/BadContentType" }
  /api/shutdown:
    post:
      tags: [system]
      summary: "Shut down the program (only available when started with --allow-shutdown; always 403 in Docker)"
      responses:
        "200":
          description: Shutdown scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "403":
          description: Not enabled (the case in Docker) or rejected by the Host / Origin guard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  responses:
    ForbiddenHost:
      description: 'Host is not on the allow-list. The GET response is **text/plain**, in the form `Forbidden host: <host name>。…`'
      content:
        text/plain:
          schema: { type: string }
    Denied:
      description: The POST was rejected by the Host / Origin guard; `error` says which check failed and how to let it through
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Something is wrong with the request; `error` is a reason in Chinese that can be shown to the user directly
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadContentType:
      description: Wrong Content-Type (JSON endpoints must use application/json; the upload must use application/octet-stream)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Info:
      type: object
      required: [version, arch, canShutdown, bankCount]
      properties:
        version: { type: string, example: "0.3" }
        arch: { type: string, example: x86_64 }
        canShutdown: { type: boolean }
        bankCount: { type: integer, description: Number of active questions }
    Opt:
      type: object
      required: [key, text]
      properties:
        key: { type: string, example: A }
        text: { type: string }
    Item:
      type: object
      required: [text, choices]
      properties:
        text: { type: string }
        choices: { type: array, items: { type: string }, example: [はい, いいえ] }
    Zh:
      type: object
      description: |
        The structure split out for Chinese (and for English, which has the same shape); when the structure cannot be matched to the
        Japanese question, the whole `zh` / `en` is null (the frontend greys out the button of that language instead of showing
        misaligned content).
      required: [stem]
      properties:
        stem: { type: string }
        options: { type: array, items: { type: string }, description: Single / multiple choice only }
        items: { type: array, items: { type: string }, description: Hotspot questions only }
        choices:
          type: array
          items: { type: array, items: { type: string } }
          description: |
            Hotspot questions only: the options written in **this language** at the end of each sub-item (Japanese `はい / いいえ`,
            Chinese `是 / 否`, English `Yes / No`). It is present only when the number of options matches the Japanese one;
            the position of an option is the answer index, so the j-th option has the same meaning in all three languages.
            When absent, the UI shows the Japanese options.
    Question:
      type: object
      required: [kind, tag, stem, options, items, answer, translation, zh, explanation, mnemonic, note, id, sheet, row]
      properties:
        kind: { type: string, enum: [single, multi, hotspot] }
        tag: { type: string, description: "`ホットスポット` for hotspot questions, empty for the others" }
        stem: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/Opt" } }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        answer:
          oneOf:
            - { type: array, items: { type: string }, description: "Single / multiple choice: letters, e.g. [\"B\"]" }
            - { type: array, items: { type: integer }, description: "Hotspot: the option index chosen for each sub-item, e.g. [0, 1, 0]" }
        translation: { type: string }
        zh: { nullable: true, allOf: [{ $ref: "#/components/schemas/Zh" }] }
        english:
          type: string
          description: "Only in the four-column format (A English, B Chinese, C Japanese, D answer): the English original from column A. Questions without English do not have this key (so the output of the three-column format is exactly the same as before)"
        en: { nullable: true, allOf: [{ $ref: "#/components/schemas/Zh" }], description: "English split along the structure of the Japanese; can only appear in the four-column format" }
        explanation: { type: string }
        mnemonic: { type: string }
        note: { type: string }
        id: { type: string, description: "Question identity (content fingerprint of sheet + question text + first option, 12 hex digits; duplicates get -2, -3 …)", example: 94e4bfe00e8d }
        sheet: { type: string }
        row: { type: integer, description: Row number in Excel (for display only) }
    SheetInfo:
      type: object
      required: [name, usable, inactive, total, skipped]
      properties:
        name: { type: string }
        usable: { type: integer }
        inactive: { type: integer, description: Number of deactivated questions }
        total: { type: integer }
        skipped: { type: array, items: { $ref: "#/components/schemas/SkippedRow" } }
    SkippedRow:
      type: object
      required: [row, reason]
      properties:
        row: { type: integer }
        reason: { type: string }
    Bank:
      type: object
      required: [file, mtime, error, questions, sheets]
      properties:
        file: { type: string, description: File name of the most recent import }
        mtime: { type: string, description: "Time of the most recent import, YYYY-MM-DD HH:MM (local time, no time zone)" }
        error: { type: string }
        questions: { type: array, items: { $ref: "#/components/schemas/Question" } }
        sheets: { type: array, items: { $ref: "#/components/schemas/SheetInfo" } }
    QuestionStat:
      type: object
      required: [attempts, correct, wrong, streak]
      properties:
        attempts: { type: integer }
        correct: { type: integer }
        wrong: { type: integer }
        streak: { type: integer, description: Current number of consecutive correct answers }
        last: { type: boolean, description: "Whether the last attempt was correct (this key is absent if the question was never answered)" }
        at: { type: string, description: Time of the most recent attempt }
    HistoryEntry:
      type: object
      required: [at, sheets, mode, total, correct, percent, seconds]
      properties:
        at: { type: string }
        sheets: { type: array, items: { type: string } }
        mode: { type: string, enum: [all, weak, retry] }
        total: { type: integer }
        correct: { type: integer }
        percent: { type: integer, description: "Round half to even (Python round): 1/8 → 12" }
        seconds: { type: integer }
    Progress:
      type: object
      required: [version, questions, history, masterStreak]
      properties:
        version: { type: integer, example: 1 }
        questions: { type: object, additionalProperties: { $ref: "#/components/schemas/QuestionStat" } }
        history: { type: array, items: { $ref: "#/components/schemas/HistoryEntry" }, description: "The 60 most recent exams, newest first" }
        masterStreak: { type: integer, example: 2, description: "How many consecutive correct answers move a wrong question out of the wrong-answer notebook" }
    ImportRecord:
      type: object
      required: [id, at, filename, added, updated, removed, restored, skipped, total]
      properties:
        id: { type: integer }
        at: { type: string }
        filename: { type: string }
        added: { type: integer }
        updated: { type: integer }
        removed: { type: integer }
        restored: { type: integer }
        skipped: { type: integer }
        total: { type: integer, description: Number of active questions after the import }
    SheetPlan:
      type: object
      required: [name, total, usable, skipped, added, updated, removed, restored]
      properties:
        name: { type: string }
        total: { type: integer }
        usable: { type: integer }
        skipped: { type: array, items: { $ref: "#/components/schemas/SkippedRow" } }
        added: { type: integer }
        updated: { type: integer }
        removed: { type: integer }
        restored: { type: integer }
        skippedMore: { type: integer, description: "Preview only: how many entries of the 'unreadable' list are not shown after it was truncated (at most 30 are listed per sheet)" }
        skippedCount: { type: integer, description: "Preview only: the total number of unreadable rows in this sheet" }
    ImportPlan:
      type: object
      required: [sheets, added, updated, unchanged, restored, removed, skipped, usable, removed_samples, removed_stats]
      properties:
        sheets: { type: array, items: { $ref: "#/components/schemas/SheetPlan" } }
        added: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        restored: { type: integer, description: "Questions that were deactivated earlier and appear again this time (restored automatically, their study records come back with them)" }
        removed: { type: integer, description: "Questions that are in the database but cannot be found in the file (deactivated, their study records are kept)" }
        skipped: { type: integer }
        usable: { type: integer }
        removed_samples: { type: array, items: { type: string }, description: "The first 40 characters of the question text of the questions to be deactivated, at most 5 entries" }
        removed_stats: { type: integer, description: How many of the questions to be deactivated have answer records }
    ImportPreview:
      allOf:
        - { $ref: "#/components/schemas/ImportPlan" }
        - type: object
          required: [filename, token]
          properties:
            filename: { type: string }
            token: { type: string, description: "One-time confirmation code (128 random bits, 22 characters), valid for 30 minutes" }
    AttemptRequest:
      type: object
      required: [results]
      properties:
        results:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [id, correct]
            properties:
              id: { type: string }
              correct: { type: boolean }
        sheets: { type: array, maxItems: 50, items: { type: string } }
        mode: { type: string, enum: [all, weak, retry], default: all }
        seconds: { type: integer, minimum: 0, maximum: 604800, default: 0 }
