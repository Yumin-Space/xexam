# Xexam's Nginx: the only entry point exposed to the outside.
#   · serves the frontend static files (already placed in the image at build time)
#   · reverse-proxies /api/ to the backend (the backend sits on a private network and publishes no port)
#   · reverse-proxies /api/ai/ to the AI service (ai-service) after the backend has checked the request (auth_request);
#     the AI service never receives a cookie or any other credential, only the backend's signed identity statement
#   · 20 MB upload limit, security headers, rate limiting, timeouts, logging
#
# About Host: the backend checks that Host is on an allow-list (against DNS rebinding), so the Host sent by the browser must be forwarded to the backend unchanged here
# (proxy_set_header Host $http_host), and X-Forwarded-* is not treated as a trusted source — the backend never reads it, and it is cleared here as well.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # The access log records the path only, never the query string: the study saved routes carry session keys and
    # record times in the query, and those are never logged anywhere.
    log_format xexam '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout xexam;

    # Temp files go to /tmp: the image runs as non-root
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 30s;

    # The backend host name is resolved at "runtime" (Docker's built-in DNS), not at startup:
    # if the backend restarts, is not up yet, or changes IP, Nginx does not exit; it just returns 502 for a while.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Limits: several users share this server, and behind a tunnel (Cloudflare Tunnel) they all arrive from the tunnel's
    # one address, so they share one bucket. One page load sends about ten API requests and the System log page polls
    # every 0.5 s: 30 requests per second with a burst of 120 keeps quick refreshes by a few users plus the log polling well
    # below the limit, while a runaway script is still stopped. Uploads keep their own, much smaller limit.
    limit_req_zone $binary_remote_addr zone=api:1m    rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:1m rate=1r/s;
    # AI routes: per address like the API zone (behind a tunnel all users share one address, so the same generous rate)
    limit_req_zone $binary_remote_addr   zone=ai:1m     rate=30r/s;
    # Starting an AI answer: per session (cookie), so users behind one tunnel address never share this bucket; requests
    # without a session cookie are not counted here (the auth step refuses them anyway). The auth step signs a request
    # in only when this key is its session token (exactly one cookie named xexam_session in any letter case, written
    # plainly; backend auth::single_session_token), so a second, empty, padded or differently cased xexam_session cookie
    # cannot move a signed-in client to a new bucket. Change the key only together with that function.
    limit_req_zone $cookie_xexam_session zone=aisend:2m rate=20r/m;
    limit_req_status 429;

    # Slow attacks: headers and body must both be fully sent within a reasonable time
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;

    # Request body limit. The backend also enforces 20 MiB independently on the real byte count; this is only the first line of defense.
    client_max_body_size 20m;

    # The allowed Hosts come from the same backend configuration (XEXAM_ALLOWED_HOSTS). Nginx here only rejects requests with "no Host at all / an obviously malformed Host";
    # the exact allow-list check is left to the backend (which also gives an actionable 403 hint).
    map $http_host $host_ok {
        default 1;
        ""      0;
    }

    # Body of a refused AI request, by the reason the auth step gave (X-Xexam-Deny). The password text must stay equal to
    # MSG_PASSWORD_CHANGE_REQUIRED in backend/src/api/response.rs (nginx_check.py compares them).
    map $ai_deny $ai_forbidden_body {
        password '{"error": "请先设置新密码。", "code": "auth.password"}';
        guard    '{"error": "被拒绝：这个请求的 Host 或 Origin 不在允许的列表里，请检查 XEXAM_ALLOWED_HOSTS 和 XEXAM_ALLOWED_ORIGINS。", "code": "auth.guard"}';
        default  '{"error": "请求无效。", "code": "ai.badRequest"}';
    }

    server {
        # IPv4 only: Docker publishes only IPv4 ports here; an unconditional [::] listen makes nginx exit outright on kernels without IPv6
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        if ($host_ok = 0) { return 444; }

        # Nginx passes a proxied path upstream exactly as the client sent it. A path that only reaches /api/ after Nginx
        # resolved "." / ".." segments or %-escaped dots, slashes or backslashes in it is refused here, so a crafted path can
        # never carry a private route (the backend's /internal/, reachable only on the internal network) to a service.
        if ($request_uri ~* "^[^?]*(/\.|%2e|%2f|%5c)") { return 404; }

        # —— Security headers ——
        # Note nginx's rule: as soon as a location writes its own add_header, it no longer inherits the server-level headers.
        # So the locations below (/assets/, /index.html, error pages) each repeat the headers they need; change them together with this block.
        # /assets/ and the error pages return scripts / styles / JSON, not pages that can be embedded or executed, so CSP and Permissions-Policy only matter for index.html.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # No inline styles: the frontend has turned style attributes into CSS classes or el.style
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # No directory listing, no hidden files
        autoindex off;
        location ~ /\. { return 404; }

        # —— AI service (ai-service) ——
        # Every request is first checked by the backend (auth_request: session cookie, Host / Origin guard, password change).
        # The AI container never receives a cookie or any other credential: it gets only X-Xexam-Identity, the backend's signed
        # statement of who is asking (a value sent by the client is always overwritten).
        location /api/ai/ {
            limit_except GET POST { deny all; }
            limit_req zone=ai burst=120 nodelay;
            client_max_body_size 256k;

            auth_request     /_ai_auth;
            auth_request_set $ai_identity $upstream_http_x_xexam_identity;
            auth_request_set $ai_deny     $upstream_http_x_xexam_deny;

            set $ai_upstream http://ai-service:8766;
            proxy_pass $ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";
            proxy_set_header Cookie                  "";
            proxy_set_header Authorization           "";
            proxy_set_header Cf-Access-Jwt-Assertion "";
            proxy_set_header X-Xexam-Identity        $ai_identity;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    90s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_intercept_errors off;           # the AI service's own JSON errors (403 / 409 / 503 …) pass through unchanged
            error_page 401 = @ai_signin;          # from the auth step
            error_page 403 = @ai_forbidden;       # from the auth step or limit_except
            error_page 500 = @ai_backend_down;    # the auth step failed (backend down, link off)
            error_page 413 = @ai_too_large;
            error_page 502 503 504 = @ai_down;    # ai-service absent / stopped
        }
        # The AI file import's upload (POST /api/ai/import/upload): a copy of the /api/ai/ location above (the same
        # auth_request step, the same identity header, every scrub of Cookie / Authorization / Cf-Access) with only these
        # differences: POST only, the upload rate limit zone (one bucket behind a tunnel, shared with the Excel upload), a
        # 20 MB body that is received completely before the AI service sees it (kept in the tmpfs /tmp/client_body until the
        # request ends), a longer send timeout, and its own 413 answer. The auth step runs before the body is read, so an
        # unauthenticated upload is a 401 and its body is never proxied. Change it together with /api/ai/.
        location = /api/ai/import/upload {
            limit_except POST { deny all; }
            limit_req zone=upload burst=5 nodelay;
            client_max_body_size 20m;

            auth_request     /_ai_auth;
            auth_request_set $ai_identity $upstream_http_x_xexam_identity;
            auth_request_set $ai_deny     $upstream_http_x_xexam_deny;

            set $ai_upstream http://ai-service:8766;
            proxy_pass $ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";
            proxy_set_header Cookie                  "";
            proxy_set_header Authorization           "";
            proxy_set_header Cf-Access-Jwt-Assertion "";
            proxy_set_header X-Xexam-Identity        $ai_identity;

            proxy_connect_timeout 5s;
            proxy_send_timeout    120s;
            proxy_read_timeout    90s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_intercept_errors off;           # the AI service's own JSON errors (403 / 409 / 415 / 503 ...) pass through unchanged
            error_page 401 = @ai_signin;          # from the auth step
            error_page 403 = @ai_forbidden;       # from the auth step or limit_except
            error_page 500 = @ai_backend_down;    # the auth step failed (backend down, link off)
            error_page 413 = @ai_import_too_large;
            error_page 502 503 504 = @ai_down;    # ai-service absent / stopped
        }
        # The streaming answers (chat send / retry, study hints and explanations, record summaries): long reads (keep-alive
        # comments every 15 s), never buffered, per-session start limit. The saved routes use the /api/ai/ location above.
        location ~ ^/api/ai/(send|retry|study/ask|summary/ask)$ {
            limit_except POST { deny all; }
            limit_req zone=ai burst=120 nodelay;
            limit_req zone=aisend burst=10 nodelay;
            client_max_body_size 256k;

            auth_request     /_ai_auth;
            auth_request_set $ai_identity $upstream_http_x_xexam_identity;
            auth_request_set $ai_deny     $upstream_http_x_xexam_deny;

            set $ai_upstream http://ai-service:8766;
            proxy_pass $ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";
            proxy_set_header Cookie                  "";
            proxy_set_header Authorization           "";
            proxy_set_header Cf-Access-Jwt-Assertion "";
            proxy_set_header X-Xexam-Identity        $ai_identity;

            proxy_connect_timeout 5s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_cache off;
            proxy_intercept_errors off;
            error_page 401 = @ai_signin;          # from the auth step
            error_page 403 = @ai_forbidden;       # from the auth step or limit_except
            error_page 500 = @ai_backend_down;    # the auth step failed (backend down, link off)
            error_page 413 = @ai_too_large;
            error_page 502 503 504 = @ai_down;    # ai-service absent / stopped
        }
        # The admin's Test of the AI settings: one answer of the model, and a second one when the provider refuses the first
        # request (the AI service's verify: up to 2 min per attempt), so up to about 4 min with no byte before the answer.
        # Everything else as in /api/ai/ above; only the read timeout is longer (a tunnel in front may still cut it sooner).
        location = /api/ai/admin/verify {
            limit_except GET POST { deny all; }
            limit_req zone=ai burst=120 nodelay;
            client_max_body_size 256k;

            auth_request     /_ai_auth;
            auth_request_set $ai_identity $upstream_http_x_xexam_identity;
            auth_request_set $ai_deny     $upstream_http_x_xexam_deny;

            set $ai_upstream http://ai-service:8766;
            proxy_pass $ai_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";
            proxy_set_header Cookie                  "";
            proxy_set_header Authorization           "";
            proxy_set_header Cf-Access-Jwt-Assertion "";
            proxy_set_header X-Xexam-Identity        $ai_identity;

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    300s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_intercept_errors off;
            error_page 401 = @ai_signin;          # from the auth step
            error_page 403 = @ai_forbidden;       # from the auth step or limit_except
            error_page 500 = @ai_backend_down;    # the auth step failed (backend down, link off)
            error_page 413 = @ai_too_large;
            error_page 502 503 504 = @ai_down;    # ai-service absent / stopped
        }
        # The auth step (internal only: a request from outside to /_ai_auth is 404). The backend reads Host, Origin and the
        # method of the browser's request only from the three X-Original-* headers on this route.
        location = /_ai_auth {
            internal;
            set $ai_auth_upstream http://backend:8765/internal/ai/auth;
            proxy_pass $ai_auth_upstream;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Content-Length    "";
            proxy_set_header Content-Type      "";
            proxy_set_header X-Original-Host   $http_host;
            proxy_set_header X-Original-Origin $http_origin;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Xexam-Identity  "";
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";
            proxy_connect_timeout 3s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;
        }
        # The refusals of AI requests: JSON with a stable code (the frontend translates by code)
        location @ai_signin {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 401 '{"error": "请先登录。", "code": "auth.signin"}';
        }
        location @ai_forbidden {
            uninitialized_variable_warn off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 403 $ai_forbidden_body;
        }
        location @ai_backend_down {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 503 '{"error": "主服务暂时连不上，请稍后再试。", "code": "ai.backendDown"}';
        }
        location @ai_down {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 502 '{"error": "AI 服务暂时连不上。", "code": "ai.unavailable"}';
        }
        location @ai_import_too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 413 '{"error": "文件太大了（最大 20 MB）。", "code": "ai.import.tooLarge", "maxMb": 20}';
        }
        location @ai_too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 413 '{"error": "请求太大了。", "code": "ai.badRequest"}';
        }

        # —— API: handed to the backend ——
        location /api/ {
            limit_except GET HEAD POST { deny all; }
            limit_req zone=api burst=120 nodelay;

            set $backend_upstream http://backend:8765;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward Host unchanged (including the port); all other forwarding headers are cleared, the backend neither trusts nor reads them
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    90s;   # upload parsing takes at most 30 seconds, leaving some margin

            # No response buffering; the request body is received in full before forwarding (slow uploads do not occupy a backend thread)
            proxy_request_buffering on;
            proxy_buffering off;

            # When the backend is down, give the frontend a readable JSON instead of Nginx's HTML page
            proxy_intercept_errors off;
            error_page 413 = @too_large;
            error_page 502 503 504 = @backend_down;
        }

        # Separate rate limit for uploads (POST /api/upload)
        location = /api/upload {
            limit_except POST { deny all; }
            limit_req zone=upload burst=5 nodelay;

            set $backend_upstream http://backend:8765;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    120s;
            proxy_read_timeout    90s;
            proxy_request_buffering on;
            proxy_buffering off;
            error_page 413 = @too_large;
            error_page 502 503 504 = @backend_down;
        }

        # —— 413 (over 20 MB): return the same JSON and the same (Chinese) message text as the backend, so the frontend can show the reason ——
        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 413 '{"error": "文件太大了（最大 20 MB）。题库通常只有 1–2 MB，请确认选对了文件。"}';
        }
        location @backend_down {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 502 '{"error": "后端暂时连不上，请稍后刷新页面再试。"}';
        }

        # —— Frontend static files ——
        # Hashed assets can be cached long-term; the entry page is not cached, so updates take effect immediately.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        }
        # This app has no URL-driven pages (it is a state machine), so no SPA fallback is needed: an unknown path is simply 404.
        # The backend's private /internal/ routes (also /internal/ai/heartbeat, where ai-service reports its state) and the
        # AI service's /healthz have no location here, so from outside they are 404 as well.
        location / {
            try_files $uri $uri/ =404;
        }

        # For the container health check; bypasses the Host allow-list (local access)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
