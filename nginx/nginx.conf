# Xexam's Nginx: the only entry point exposed to the outside.
#   · serves the frontend static files (already placed in the image at build time)
#   · reverse-proxies /api/ to the backend (the backend sits on a private network and publishes no port)
#   · 20 MB upload limit, security headers, rate limiting, timeouts, logging
#
# About Host: the backend checks that Host is on an allow-list (against DNS rebinding), so the Host sent by the browser must be forwarded to the backend unchanged here
# (proxy_set_header Host $http_host), and X-Forwarded-* is not treated as a trusted source — the backend never reads it, and it is cleared here as well.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    access_log /dev/stdout combined;

    # Temp files go to /tmp: the image runs as non-root
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 30s;

    # The backend host name is resolved at "runtime" (Docker's built-in DNS), not at startup:
    # if the backend restarts, is not up yet, or changes IP, Nginx does not exit; it just returns 502 for a while.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Limits: single user, only guards against runaway scripts
    limit_req_zone $binary_remote_addr zone=api:1m    rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:1m rate=1r/s;
    limit_req_status 429;

    # Slow attacks: headers and body must both be fully sent within a reasonable time
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;

    # Request body limit. The backend also enforces 20 MiB independently on the real byte count; this is only the first line of defense.
    client_max_body_size 20m;

    # The allowed Hosts come from the same backend configuration (XEXAM_ALLOWED_HOSTS). Nginx here only rejects requests with "no Host at all / an obviously malformed Host";
    # the exact allow-list check is left to the backend (which also gives an actionable 403 hint).
    map $http_host $host_ok {
        default 1;
        ""      0;
    }

    server {
        # IPv4 only: Docker publishes only IPv4 ports here; an unconditional [::] listen makes nginx exit outright on kernels without IPv6
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        if ($host_ok = 0) { return 444; }

        # —— Security headers ——
        # Note nginx's rule: as soon as a location writes its own add_header, it no longer inherits the server-level headers.
        # So the locations below (/assets/, /index.html, error pages) each repeat the headers they need; change them together with this block.
        # /assets/ and the error pages return scripts / styles / JSON, not pages that can be embedded or executed, so CSP and Permissions-Policy only matter for index.html.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # No inline styles: the frontend has turned style attributes into CSS classes or el.style
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # No directory listing, no hidden files
        autoindex off;
        location ~ /\. { return 404; }

        # —— API: handed to the backend ——
        location /api/ {
            limit_except GET HEAD POST { deny all; }
            limit_req zone=api burst=30 nodelay;

            set $backend_upstream http://backend:8765;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward Host unchanged (including the port); all other forwarding headers are cleared, the backend neither trusts nor reads them
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    90s;   # upload parsing takes at most 30 seconds, leaving some margin

            # No response buffering; the request body is received in full before forwarding (slow uploads do not occupy a backend thread)
            proxy_request_buffering on;
            proxy_buffering off;

            # When the backend is down, give the frontend a readable JSON instead of Nginx's HTML page
            proxy_intercept_errors off;
            error_page 413 = @too_large;
            error_page 502 503 504 = @backend_down;
        }

        # Separate rate limit for uploads (POST /api/upload)
        location = /api/upload {
            limit_except POST { deny all; }
            limit_req zone=upload burst=5 nodelay;

            set $backend_upstream http://backend:8765;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    120s;
            proxy_read_timeout    90s;
            proxy_request_buffering on;
            proxy_buffering off;
            error_page 413 = @too_large;
            error_page 502 503 504 = @backend_down;
        }

        # —— 413 (over 20 MB): return the same JSON and the same (Chinese) message text as the backend, so the frontend can show the reason ——
        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 413 '{"error": "文件太大了（最大 20 MB）。题库通常只有 1–2 MB，请确认选对了文件。"}';
        }
        location @backend_down {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 502 '{"error": "后端暂时连不上，请稍后刷新页面再试。"}';
        }

        # —— Frontend static files ——
        # Hashed assets can be cached long-term; the entry page is not cached, so updates take effect immediately.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        }
        # This app has no URL-driven pages (it is a state machine), so no SPA fallback is needed: an unknown path is simply 404.
        location / {
            try_files $uri $uri/ =404;
        }

        # For the container health check; bypasses the Host allow-list (local access)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
