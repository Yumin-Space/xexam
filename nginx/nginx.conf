# Xexam 的 Nginx：唯一对外的入口。
#   · 提供前端静态文件（构建时已放进镜像）
#   · /api/ 反向代理给后端（后端在私有网络里，不发布端口）
#   · 20 MB 上传上限、安全头、限流、超时、日志
#
# 关于 Host：后端会检查 Host 是否在白名单里（防 DNS 重绑定），所以这里必须把浏览器发来的 Host 原样转给后端
# （proxy_set_header Host $http_host），并且不把 X-Forwarded-* 当作信任来源——后端从不读它们，这里也清空。

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    access_log /dev/stdout combined;

    # 临时文件放 /tmp：镜像以非 root 运行
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 30s;

    # 后端的主机名在「运行时」解析（Docker 内置 DNS），而不是启动时：
    # 后端重启、还没起来、或者换了 IP，Nginx 都不会跟着退出，只是暂时返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 限制：单人使用，只防失控脚本
    limit_req_zone $binary_remote_addr zone=api:1m    rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:1m rate=1r/s;
    limit_req_status 429;

    # 慢速攻击：头和体都要在合理时间内发完
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;

    # 请求体上限。后端自己也会独立按真实字节数限制 20 MiB，这里只是第一道。
    client_max_body_size 20m;

    # 允许的 Host 来自后端同一份配置（XEXAM_ALLOWED_HOSTS）。Nginx 这边只挡「完全没有 Host / 明显乱写」的请求；
    # 精确的白名单判断留给后端（它同时负责给出可照着做的 403 提示）。
    map $http_host $host_ok {
        default 1;
        ""      0;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        if ($host_ok = 0) { return 444; }

        # —— 安全头 ——
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # 样式不用内联：前端已经把 style 属性改成 CSS 类或 el.style
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # 不列目录、不提供隐藏文件
        autoindex off;
        location ~ /\. { return 404; }

        # —— API：交给后端 ——
        location /api/ {
            limit_except GET HEAD POST { deny all; }
            limit_req zone=api burst=30 nodelay;

            set $backend_upstream http://backend:8765;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 原样转发 Host（含端口）；其余转发头一律清空，后端不信任也不读它们
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    90s;   # 上传解析最多 30 秒，留余量

            # 不缓冲响应；请求体先收完再转（慢速上传不占后端线程）
            proxy_request_buffering on;
            proxy_buffering off;

            # 后端挂了时给前端一个能读懂的 JSON，而不是 Nginx 的 HTML 页
            proxy_intercept_errors off;
            error_page 413 = @too_large;
            error_page 502 503 504 = @backend_down;
        }

        # 上传单独限流（POST /api/upload）
        location = /api/upload {
            limit_except POST { deny all; }
            limit_req zone=upload burst=5 nodelay;

            set $backend_upstream http://backend:8765;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   "";
            proxy_set_header X-Forwarded-Host  "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded         "";
            proxy_set_header X-Real-IP         "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    120s;
            proxy_read_timeout    90s;
            proxy_request_buffering on;
            proxy_buffering off;
            error_page 413 = @too_large;
            error_page 502 503 504 = @backend_down;
        }

        # —— 413（超过 20 MB）：返回和后端一样的 JSON 和中文文案，前端才能把原因显示出来 ——
        error_page 413 = @too_large;
        location @too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 413 '{"error": "文件太大了（最大 20 MB）。题库通常只有 1–2 MB，请确认选对了文件。"}';
        }
        location @backend_down {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 502 '{"error": "后端暂时连不上，请稍后刷新页面再试。"}';
        }

        # —— 前端静态文件 ——
        # 带哈希的资源可以长期缓存；入口页不缓存，这样更新后马上生效。
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files $uri =404;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        }
        # 这个应用没有按网址切换的页面（状态机），所以不需要 SPA 回退：未知路径就是 404。
        location / {
            try_files $uri $uri/ =404;
        }

        # 容器健康检查用，不经过 Host 白名单（本机访问）
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
