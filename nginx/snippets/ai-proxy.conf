# Header block of every location that proxies to ai-service (included inside the location). The AI container never
# receives a cookie or any other credential: only X-Xexam-Identity, the backend's signed statement of who is asking
# (a client value is always overwritten). X-Real-IP is the client address; X-Geo-* is the Cloudflare place, believed only
# from a trusted proxy ($xexam_geo_* are empty otherwise, the same maps as in api-proxy.conf). ai-service copies it into
# the System log rows it writes; a client-sent value never gets through.
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   "";
proxy_set_header X-Forwarded-Host  "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header Forwarded         "";
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Cookie                  "";
proxy_set_header Authorization           "";
proxy_set_header Cf-Access-Jwt-Assertion "";
proxy_set_header X-Xexam-Identity        $ai_identity;
proxy_set_header X-Geo-Country     $xexam_geo_country;
proxy_set_header X-Geo-Region      $xexam_geo_region;
proxy_set_header X-Geo-City        $xexam_geo_city;
