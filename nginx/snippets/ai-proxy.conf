# Header block of every location that proxies to ai-service (included inside the location). The AI container never
# receives a cookie or any other credential: only X-Xexam-Identity, the backend's signed statement of who is asking
# (a client value is always overwritten). X-Real-IP is the client address (ai-service does not use the location).
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   "";
proxy_set_header X-Forwarded-Host  "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header Forwarded         "";
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Cookie                  "";
proxy_set_header Authorization           "";
proxy_set_header Cf-Access-Jwt-Assertion "";
proxy_set_header X-Xexam-Identity        $ai_identity;
# ai-service does not use the location: a client-sent X-Geo-* never reaches it
proxy_set_header X-Geo-Country     "";
proxy_set_header X-Geo-Region      "";
proxy_set_header X-Geo-City        "";
