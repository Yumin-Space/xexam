# Header block of every location that proxies to the backend (included inside the location).
# Host is forwarded unchanged (including the port); every other forwarding header is cleared, the backend neither trusts
# nor reads them. X-Real-IP and X-Geo-* are always overwritten: the address is $remote_addr (rewritten by the realip
# module when the peer is a trusted proxy) and the location headers are believed only from a trusted proxy ($xexam_geo_*
# are empty otherwise; see /tmp/xexam-realip.conf and the maps in nginx.conf).
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   "";
proxy_set_header X-Forwarded-Host  "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header Forwarded         "";
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Geo-Country     $xexam_geo_country;
proxy_set_header X-Geo-Region      $xexam_geo_region;
proxy_set_header X-Geo-City        $xexam_geo_city;
